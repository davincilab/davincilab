<script>
window.BB_MODULES['guest'] = function () {
/*
 * guest.js — the app a visitor gets after scanning the QR code on the umbrella.
 *
 * Routes (hash based): #menu, #cart, #orders, #order/<id>, #account
 */
(function () {
  'use strict';

  var el = UI.el, t = UI.t, tx = UI.tx, money = UI.money;
  var CART_KEY = 'bb.cart.v1';

  var view = UI.$('#view');
  var cartbar = UI.$('#cartbar');
  var chips = UI.$('#chips');

  var cart = loadCart();
  var activeCategory = 'all';

  /* Checkout form state — kept outside the view so a re-render (e.g. after
     saving a card) does not throw away what the guest already typed. */
  var draft = { note: '', music: '', payMode: null, wantsInvoice: null };

  // --- cart persistence ----------------------------------------------------

  function loadCart() {
    try { return JSON.parse(Store.storage.getItem(CART_KEY)) || []; } catch (e) { return []; }
  }
  function saveCart() {
    Store.storage.setItem(CART_KEY, JSON.stringify(cart));
    renderCartBar();
  }
  function addToCart(line) {
    var key = Store.lineKey(line);
    var existing = cart.find(function (l) { return Store.lineKey(l) === key; });
    if (existing) existing.qty += line.qty;
    else cart.push(line);
    saveCart();
  }
  function cartCount() {
    return cart.reduce(function (n, line) { return n + line.qty; }, 0);
  }

  // --- umbrella ------------------------------------------------------------

  function currentUmbrella() { return Store.device.umbrella; }

  function resolveUmbrella() {
    var fromUrl = UI.param('u');
    if (fromUrl && Number(fromUrl) > 0) {
      var n = Math.min(Number(fromUrl), Store.settings.umbrellaCount);
      if (n !== Store.device.umbrella) Store.saveDevice({ umbrella: n });
    }
  }

  function askUmbrella() {
    var input;
    var ref = UI.sheet({
      title: t('umbrella'),
      content: [
        el('p.muted', { text: UI.lang() === 'el'
          ? 'Σαρώστε τον κωδικό QR στην ομπρέλα σας ή δώστε τον αριθμό της.'
          : 'Scan the QR code on your umbrella, or type its number.' }),
        (input = el('input', { type: 'number', min: '1', max: String(Store.settings.umbrellaCount),
          inputmode: 'numeric', placeholder: '12', value: currentUmbrella() || '' }))
      ],
      footer: [el('button.btn.btn--primary.btn--block', {
        type: 'button', text: t('save'),
        onclick: function () {
          var n = Number(input.value);
          if (!n || n < 1 || n > Store.settings.umbrellaCount) {
            UI.toast(UI.lang() === 'el' ? 'Μη έγκυρος αριθμός' : 'Invalid number', 'danger');
            return;
          }
          Store.saveDevice({ umbrella: n });
          ref.close();
          renderShell();   // the badge in the header shows the number too
          render();
        }
      })]
    });
    setTimeout(function () { input.focus(); }, 220);
  }

  // --- shell ---------------------------------------------------------------

  function renderShell() {
    UI.$('#barName').textContent = Store.settings.barName;
    UI.$('#topSub').textContent = t('welcome');
    UI.mount(UI.$('#umbrellaBadge'), [
      document.createTextNode('⛱️ '),
      el('b', { text: currentUmbrella() ? String(currentUmbrella()) : '–' })
    ]);
    UI.$('#umbrellaBadge').onclick = askUmbrella;
    UI.mount(UI.$('#langHost'), [UI.langToggle(function () { renderShell(); render(); })]);
    UI.$('#btnOrders').onclick = function () { UI.go('orders'); };
    UI.$('#btnAccount').onclick = function () { UI.go('account'); };
    UI.$('#cartBtn').onclick = function () { UI.go('cart'); };
    renderCartBar();
  }

  function renderCartBar() {
    var count = cartCount();
    var onMenu = UI.route() !== 'cart';
    cartbar.classList.toggle('is-visible', count > 0 && onMenu);
    UI.$('#cartCount').textContent = count + ' ' + (count === 1 ? t('item') : t('items'));
    UI.$('#cartSum').textContent = money(Store.cartTotal(cart));
  }

  function renderChips() {
    var show = UI.route() === '' || UI.route() === 'menu';
    chips.classList.toggle('hidden', !show);
    if (!show) return;
    var all = [{ id: 'all', icon: '🌴', name: { en: 'All', el: 'Όλα' } }].concat(DATA.CATEGORIES);
    UI.mount(chips, all.map(function (cat) {
      return el('button.chip', {
        type: 'button',
        'aria-pressed': activeCategory === cat.id ? 'true' : 'false',
        onclick: function () { activeCategory = cat.id; render(); }
      }, [cat.icon + ' ' + tx(cat.name)]);
    }));
  }

  // --- menu ----------------------------------------------------------------

  function viewMenu() {
    var items = DATA.MENU.filter(function (item) {
      return activeCategory === 'all' || item.cat === activeCategory;
    });
    var groups = [];
    DATA.CATEGORIES.forEach(function (cat) {
      var list = items.filter(function (item) { return item.cat === cat.id; });
      if (!list.length) return;
      groups.push(el('h2.section-title', { text: cat.icon + '  ' + tx(cat.name) }));
      groups.push(el('div.menu-list', {}, list.map(itemRow)));
    });
    UI.mount(view, [
      el('div.notice', { text: UI.lang() === 'el'
        ? 'Παραγγείλτε από την ξαπλώστρα σας — το φέρνουμε στην ομπρέλα ' + (currentUmbrella() || '?') + '.'
        : 'Order from your sunbed — we bring it to umbrella ' + (currentUmbrella() || '?') + '.' })
    ].concat(groups).concat([musicCard()]));
  }

  function itemRow(item) {
    return el('button.item', { type: 'button', onclick: function () { openItem(item); } }, [
      el('span.item__emoji', { text: item.emoji }),
      el('span.item__body', {}, [
        el('span.item__name', { text: tx(item.name) }),
        el('span.item__desc', { text: tx(item.desc) })
      ]),
      el('span.item__price', { text: money(item.price) }),
      el('span.item__add', { 'aria-hidden': 'true' }, ['+'])
    ]);
  }

  function openItem(item) {
    var options = {};
    (item.options || []).forEach(function (groupId) {
      var group = DATA.OPTION_GROUPS[groupId];
      options[groupId] = group.type === 'single' ? [group.choices[0].id] : [];
    });
    var qty = 1;
    var noteInput;
    var priceLabel = el('span');

    function refreshPrice() {
      priceLabel.textContent = money(Store.unitPrice(item.id, options) * qty);
    }

    var body = [];
    body.push(el('p.muted', { text: tx(item.desc) }));

    (item.options || []).forEach(function (groupId) {
      var group = DATA.OPTION_GROUPS[groupId];
      var list = el('div.opt-list');
      group.choices.forEach(function (choice) {
        var input = el('input', {
          type: group.type === 'single' ? 'radio' : 'checkbox',
          name: 'opt-' + groupId,
          checked: options[groupId].indexOf(choice.id) >= 0,
          onchange: function (event) {
            if (group.type === 'single') options[groupId] = [choice.id];
            else if (event.target.checked) options[groupId].push(choice.id);
            else options[groupId] = options[groupId].filter(function (id) { return id !== choice.id; });
            refreshPrice();
          }
        });
        list.appendChild(el('label.opt', {}, [
          input,
          el('span.opt__label', { text: tx(choice.name) }),
          choice.delta ? el('span.opt__delta', { text: '+' + money(choice.delta) }) : null
        ]));
      });
      body.push(el('div.opt-group', {}, [
        el('div.opt-group__head', {}, [
          el('span.opt-group__name', { text: tx(group.name) }),
          el('span.small.muted', { text: group.type === 'multi' ? t('optional') : '' })
        ]),
        list
      ]));
    });

    body.push(el('div.field', {}, [
      el('label.field__label', { text: t('note') + ' (' + t('optional') + ')' }),
      (noteInput = el('input', { type: 'text', placeholder: t('notePlaceholder') }))
    ]));

    var qtyOut = el('output', { text: '1' });
    body.push(el('div.row.row--between', {}, [
      el('span.field__label', { text: t('quantity') }),
      el('div.stepper', {}, [
        el('button', { type: 'button', 'aria-label': '-', onclick: function () {
          qty = Math.max(1, qty - 1); qtyOut.textContent = qty; refreshPrice();
        } }, ['−']),
        qtyOut,
        el('button', { type: 'button', 'aria-label': '+', onclick: function () {
          qty = Math.min(20, qty + 1); qtyOut.textContent = qty; refreshPrice();
        } }, ['+'])
      ])
    ]));

    var ref = UI.sheet({
      title: item.emoji + '  ' + tx(item.name),
      content: body,
      footer: [el('button.btn.btn--primary.btn--block', {
        type: 'button',
        onclick: function () {
          addToCart({ itemId: item.id, qty: qty, options: options, note: noteInput.value.trim() });
          ref.close();
          UI.toast(tx(item.name) + ' → ' + t('cart'), 'good');
        }
      }, [el('span', { text: t('addToCart') }), el('span.spacer'), priceLabel])]
    });
    refreshPrice();
  }

  function musicCard() {
    var input;
    return el('div.card', { style: 'margin-top:22px' }, [
      el('div.row', {}, [
        el('span', { style: 'font-size:1.6rem' }, ['🎵']),
        el('div', {}, [
          el('div.card__title', { text: t('musicWish') }),
          el('div.small.muted', { text: t('musicWishHint') })
        ])
      ]),
      el('div.row', { style: 'margin-top:12px;align-items:stretch' }, [
        (input = el('input', { type: 'text', placeholder: t('musicPlaceholder') })),
        el('button.btn.btn--primary', {
          type: 'button', text: t('sendWish'),
          onclick: function () {
            if (!currentUmbrella()) return askUmbrella();
            var request = Store.addMusicRequest({ umbrella: currentUmbrella(), text: input.value });
            if (!request) return;
            input.value = '';
            UI.toast(t('wishSent'), 'good');
          }
        })
      ])
    ]);
  }

  // --- cart ----------------------------------------------------------------

  function viewCart() {
    if (!cart.length) {
      UI.mount(view, [
        el('div.empty', {}, [
          el('span.empty__emoji', { text: '🛒' }),
          el('h2', { text: t('emptyCart') }),
          el('p.muted', { text: t('emptyCartHint') }),
          el('button.btn.btn--primary', { type: 'button', text: t('menu'),
            onclick: function () { UI.go('menu'); } })
        ])
      ]);
      return;
    }

    var noteInput, musicInput, emailWanted;
    if (!draft.payMode) draft.payMode = Store.device.card ? 'card' : 'tab';
    if (draft.wantsInvoice === null) draft.wantsInvoice = !!Store.device.email;

    var lines = el('div.card', {}, cart.map(function (line, index) {
      return el('div.line', {}, [
        el('div.line__body', {}, [
          el('div.line__name', { text: UI.itemName(line.itemId) }),
          el('div.line__opts', { text: UI.optionSummary(line) }),
          el('div.row', { style: 'margin-top:6px' }, [
            el('div.stepper', {}, [
              el('button', { type: 'button', 'aria-label': '-', onclick: function () {
                if (line.qty > 1) line.qty--; else cart.splice(index, 1);
                saveCart(); render();
              } }, ['−']),
              el('output', { text: String(line.qty) }),
              el('button', { type: 'button', 'aria-label': '+', onclick: function () {
                line.qty++; saveCart(); render();
              } }, ['+'])
            ])
          ])
        ]),
        el('div.line__price', { text: money(Store.lineTotal(line)) })
      ]);
    }));

    var total = Store.cartTotal(cart);

    var payChoices = el('div.opt-list');
    [
      { id: 'card', label: Store.device.card
          ? t('payNow') + ' · ' + Store.device.card.last4Label
          : t('payNow'), hint: Store.device.card ? '' : t('addCard') },
      { id: 'tab', label: t('payTab'), hint: t('payTabHint') },
      { id: 'cash', label: t('payCash'), hint: '' }
    ].forEach(function (choice) {
      payChoices.appendChild(el('label.opt', {}, [
        el('input', {
          type: 'radio', name: 'pay', checked: draft.payMode === choice.id,
          onchange: function () { draft.payMode = choice.id; }
        }),
        el('span.opt__label', {}, [
          el('div', { text: choice.label }),
          choice.hint ? el('div.small.muted', { text: choice.hint }) : null
        ])
      ]));
    });

    UI.mount(view, [
      el('div.row.row--between', {}, [
        el('h1', { style: 'font-size:1.3rem', text: t('cart') }),
        el('button.link-btn', { type: 'button', text: '＋ ' + t('menu'),
          onclick: function () { UI.go('menu'); } })
      ]),
      lines,
      el('div.card', {}, [
        el('div.field', {}, [
          el('label.field__label', { text: t('note') + ' (' + t('optional') + ')' }),
          (noteInput = el('textarea', { placeholder: t('notePlaceholder'), text: draft.note,
            oninput: function () { draft.note = this.value; } }))
        ]),
        el('div.field', {}, [
          el('label.field__label', { text: '🎵 ' + t('musicWish') + ' (' + t('optional') + ')' }),
          (musicInput = el('input', { type: 'text', placeholder: t('musicPlaceholder'),
            value: draft.music,
            oninput: function () { draft.music = this.value; } }))
        ])
      ]),
      el('h2.section-title', { text: t('paymentMethod') }),
      el('div.card', {}, [
        payChoices,
        Store.device.card ? null : el('button.btn.btn--ghost.btn--block', {
          type: 'button', text: '＋ ' + t('addCard'), style: 'margin-top:10px',
          onclick: function () {
            openCardSheet(function () { draft.payMode = 'card'; render(); });
          }
        }),
        el('label.opt', { style: 'margin-top:10px' }, [
          (emailWanted = el('input', { type: 'checkbox', checked: draft.wantsInvoice,
            onchange: function () { draft.wantsInvoice = this.checked; } })),
          el('span.opt__label', {}, [
            el('div', { text: '✉️ ' + t('invoiceEmail') }),
            el('div.small.muted', { text: Store.device.email || t('emailPlaceholder') })
          ])
        ])
      ]),
      el('div.card', {}, [
        el('div.totals', {}, [
          el('div.totals__row.totals__row--big', {}, [
            el('span', { text: t('total') }), el('span', { text: money(total) })
          ]),
          el('div.totals__row.small.muted', {}, [
            el('span', { text: t('vatIncluded') }),
            el('span', { text: money(total - total / (1 + Store.settings.vat)) })
          ])
        ]),
        el('button.btn.btn--primary.btn--block', {
          type: 'button', style: 'margin-top:14px',
          text: t('orderNow') + ' · ' + money(total),
          onclick: function () {
            submitOrder({
              payMode: draft.payMode,
              note: noteInput.value,
              music: musicInput.value,
              wantsInvoice: emailWanted.checked
            });
          }
        }),
        el('p.small.muted.center', { style: 'margin:10px 0 0', text: t('demoNotice') })
      ])
    ]);
  }

  // --- checkout ------------------------------------------------------------

  function submitOrder(options) {
    if (!currentUmbrella()) return askUmbrella();
    if (!cart.length) return;

    var total = Store.cartTotal(cart);

    if (options.payMode === 'card' && !Store.device.card) {
      return openCardSheet(function () { submitOrder(options); });
    }

    var finish = function (paymentInfo) {
      var order = Store.placeOrder({
        umbrella: currentUmbrella(),
        lines: cart,
        note: options.note,
        guestName: Store.device.guestName,
        channel: 'qr',
        payment: paymentInfo
      });
      if (options.music && options.music.trim()) {
        Store.addMusicRequest({ umbrella: currentUmbrella(), text: options.music });
      }
      cart = [];
      saveCart();
      draft = { note: '', music: '', payMode: null, wantsInvoice: null };
      if (options.wantsInvoice) {
        openInvoiceSheet([order.id], order.total, function () { UI.go('order/' + order.id); });
      } else {
        UI.go('order/' + order.id);
      }
      UI.toast(t('orderPlaced'), 'good');
    };

    if (options.payMode === 'card') {
      runFakePayment(total, function () {
        finish({ mode: 'card', status: 'paid', card: Store.device.card.last4Label, paidAt: Date.now() });
      });
    } else {
      finish({ mode: options.payMode, status: 'open' });
    }
  }

  /* Fake card processing — a spinner, a delay, always approved. */
  function runFakePayment(amount, done) {
    var ref = UI.sheet({
      title: t('payment'),
      content: [
        el('div.center', { style: 'padding:22px 0' }, [
          el('div', { style: 'font-size:2.2rem' }, ['💳']),
          el('h3', { style: 'margin:10px 0 4px', text: money(amount) }),
          el('p.muted', { text: t('paying') }),
          el('div', { style: 'margin-top:14px' }, [el('span.spinner', { style: 'border-top-color:var(--brand)' })])
        ]),
        el('p.small.muted.center', { text: t('demoNotice') })
      ]
    });
    setTimeout(function () {
      ref.close();
      done();
    }, 1400);
  }

  function openCardSheet(done) {
    var holder, number, expiry, cvc;
    var ref = UI.sheet({
      title: t('addCard'),
      content: [
        el('div.card-visual', {}, [
          el('div.card-visual__num', { text: '•••• •••• •••• 4242' }),
          el('div.card-visual__row', {}, [
            el('span', { text: Store.device.guestName || 'YOUR NAME' }),
            el('span', { text: '12/29' })
          ])
        ]),
        el('div.field', { style: 'margin-top:14px' }, [
          el('label.field__label', { text: t('cardHolder') }),
          (holder = el('input', { type: 'text', placeholder: 'Maria Papadopoulou',
            value: Store.device.guestName || '' }))
        ]),
        el('div.field', {}, [
          el('label.field__label', { text: t('cardNumber') }),
          (number = el('input', { type: 'tel', inputmode: 'numeric', placeholder: '4242 4242 4242 4242' }))
        ]),
        el('div.row', {}, [
          el('div.field', { style: 'flex:1' }, [
            el('label.field__label', { text: t('expiry') }),
            (expiry = el('input', { type: 'text', placeholder: '12/29' }))
          ]),
          el('div.field', { style: 'flex:1' }, [
            el('label.field__label', { text: t('cvc') }),
            (cvc = el('input', { type: 'tel', inputmode: 'numeric', placeholder: '123' }))
          ])
        ]),
        el('p.small.muted', { text: t('demoNotice') })
      ],
      footer: [el('button.btn.btn--primary.btn--block', {
        type: 'button', text: t('save'),
        onclick: function () {
          var digits = (number.value || '4242424242424242').replace(/\D/g, '');
          var last4 = digits.slice(-4) || '4242';
          Store.saveDevice({
            guestName: holder.value.trim() || Store.device.guestName,
            card: {
              holder: holder.value.trim(),
              last4: last4,
              last4Label: '•••• ' + last4,
              brand: digits[0] === '5' ? 'Mastercard' : 'Visa',
              expiry: expiry.value.trim() || '12/29'
            }
          });
          ref.close();
          UI.toast(t('cardStored'), 'good');
          if (done) done();
        }
      })]
    });
  }

  function openInvoiceSheet(orderIds, total, done) {
    var emailInput;
    var orders = orderIds.map(Store.getOrder).filter(Boolean);
    var net = total / (1 + Store.settings.vat);

    var receipt = el('div.card.card--flat', { style: 'background:var(--surface-2)' }, [
      el('div.row.row--between', {}, [
        el('b', { text: Store.settings.barName }),
        el('span.small.muted', { text: UI.clock(Date.now()) })
      ]),
      el('div.small.muted', { text: t('umbrella') + ' ' + (currentUmbrella() || '–') })
    ].concat(orders.map(function (order) {
      return el('div', { style: 'margin-top:10px' }, [
        el('div.small.muted', { text: order.id })
      ].concat(order.lines.map(function (line) {
        return el('div.row.row--between.small', {}, [
          el('span', { text: line.qty + '× ' + UI.itemName(line.itemId) }),
          el('span.tabular', { text: money(Store.lineTotal(line)) })
        ]);
      })));
    })).concat([
      el('hr', { style: 'border:0;border-top:1px solid var(--border);margin:10px 0' }),
      el('div.row.row--between.small', {}, [
        el('span', { text: 'Netto' }), el('span.tabular', { text: money(net) })
      ]),
      el('div.row.row--between.small', {}, [
        el('span', { text: 'VAT 24%' }), el('span.tabular', { text: money(total - net) })
      ]),
      el('div.row.row--between', { style: 'font-weight:700' }, [
        el('span', { text: t('total') }), el('span.tabular', { text: money(total) })
      ])
    ]));

    var ref = UI.sheet({
      title: t('invoiceEmail'),
      content: [
        receipt,
        el('div.field', { style: 'margin-top:14px' }, [
          el('label.field__label', { text: 'E-Mail' }),
          (emailInput = el('input', { type: 'email', placeholder: t('emailPlaceholder'),
            value: Store.device.email || '' }))
        ]),
        el('p.small.muted', { text: t('demoNotice') })
      ],
      footer: [
        el('button.btn.btn--ghost', { type: 'button', text: t('close'),
          onclick: function () { ref.close(); if (done) done(); } }),
        el('button.btn.btn--primary', {
          type: 'button', text: t('sendInvoice'),
          onclick: function () {
            var email = (emailInput.value || '').trim();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
              UI.toast(UI.lang() === 'el' ? 'Μη έγκυρο e-mail' : 'Invalid e-mail', 'danger');
              return;
            }
            Store.saveDevice({ email: email });
            Store.sendInvoice({ email: email, umbrella: currentUmbrella(),
              orderIds: orderIds, total: total });
            ref.close();
            UI.toast(t('invoiceSent') + ' ' + email, 'good');
            if (done) done();
          }
        })
      ],
      onClose: null
    });
  }

  // --- orders --------------------------------------------------------------

  function viewOrders() {
    var orders = Store.ordersForUmbrella(currentUmbrella());
    var tab = Store.tabFor(currentUmbrella());

    var head = [el('h1', { style: 'font-size:1.3rem;margin-bottom:10px', text: t('yourOrders') })];

    if (tab.total > 0) {
      head.push(el('div.card', {}, [
        el('div.row.row--between', {}, [
          el('div', {}, [
            el('div.card__title', { text: t('openTab') }),
            el('div.small.muted', { text: tab.orders.length + ' ' + t('orders') })
          ]),
          el('div', { style: 'font-size:1.4rem;font-weight:700' }, [money(tab.total)])
        ]),
        el('div.row', { style: 'margin-top:12px' }, [
          el('button.btn.btn--primary', {
            type: 'button', text: t('payTabNow') + ' · ' + money(tab.total),
            style: 'flex:1',
            onclick: function payTab() {
              // no card yet → ask for one, then come straight back to the payment
              if (!Store.device.card) return openCardSheet(payTab);
              runFakePayment(tab.total, function () {
                var ids = tab.orders.map(function (o) { return o.id; });
                Store.markPaid(ids, { mode: 'card', card: Store.device.card.last4Label });
                UI.toast(t('paid'), 'good');
                openInvoiceSheet(ids, tab.total, null);
              });
            }
          }),
          el('button.btn.btn--ghost', {
            type: 'button', text: '✉️',
            'aria-label': t('invoiceEmail'),
            onclick: function () {
              openInvoiceSheet(tab.orders.map(function (o) { return o.id; }), tab.total, null);
            }
          })
        ])
      ]));
    }

    if (!orders.length) {
      head.push(el('div.empty', {}, [
        el('span.empty__emoji', { text: '🧾' }),
        el('p', { text: t('noOrders') })
      ]));
    }

    UI.mount(view, head.concat(orders.map(orderCard)));
  }

  function orderCard(order) {
    return el('button.card', {
      type: 'button', style: 'width:100%;text-align:left;cursor:pointer',
      onclick: function () { UI.go('order/' + order.id); }
    }, [
      el('div.row.row--between', {}, [
        el('div.row', {}, [
          el('span.pill.pill--' + order.status, { text: UI.statusLabel(order.status) }),
          el('span.small.muted', { text: UI.clock(order.createdAt) })
        ]),
        el('b.tabular', { text: money(order.total) })
      ]),
      el('div.small.muted', { style: 'margin-top:6px', text: order.lines.map(function (line) {
        return line.qty + '× ' + UI.itemName(line.itemId);
      }).join(', ') }),
      el('div.row', { style: 'margin-top:8px' }, [
        el('span.small.muted', { text: order.id }),
        el('span.spacer'),
        el('span.pill.pill--' + (order.payment.status === 'paid' ? 'paid' : 'open'), {
          text: order.payment.status === 'paid' ? t('paid') : t('open')
        })
      ])
    ]);
  }

  function viewOrderDetail(orderId) {
    var order = Store.getOrder(orderId);
    if (!order) { UI.go('orders'); return; }

    var steps = ['new', 'preparing', 'ready', 'served'];
    var currentIndex = steps.indexOf(order.status);
    var stamps = { new: order.createdAt, preparing: order.acceptedAt, ready: order.readyAt, served: order.servedAt };

    var timeline = el('div.timeline');
    steps.forEach(function (status, index) {
      var done = order.status !== 'cancelled' && index < currentIndex;
      var current = index === currentIndex;
      timeline.appendChild(el('div.tl-step' + (done ? '.is-done' : '') + (current ? '.is-current' : ''), {}, [
        el('div.tl-step__dot', { text: done ? '✓' : '' }),
        el('div', {}, [
          el('div.tl-step__label', { text: UI.statusLabel(status) }),
          stamps[status] ? el('div.tl-step__time', { text: UI.clock(stamps[status]) }) : null
        ])
      ]));
      if (index < steps.length - 1) {
        timeline.appendChild(el('div.tl-step__rail' + (done ? '.is-done' : '')));
      }
    });

    var etaMinutes = Math.max(1, Math.round(
      (order.createdAt + Store.settings.avgPrepMinutes * 60000 - Date.now()) / 60000));

    UI.mount(view, [
      el('div.row.row--between', {}, [
        el('button.link-btn', { type: 'button', text: '← ' + t('yourOrders'),
          onclick: function () { UI.go('orders'); } }),
        el('span.pill.pill--' + order.status, { text: UI.statusLabel(order.status) })
      ]),
      el('div.card', { style: 'margin-top:10px' }, [
        el('div.row.row--between', {}, [
          el('h2', { style: 'font-size:1.1rem', text: t('orderPlaced') }),
          el('span.small.muted', { text: order.id })
        ]),
        el('p.small.muted', { text: t('orderPlacedHint') }),
        order.status !== 'served' && order.status !== 'cancelled'
          ? el('div.notice', { text: '⏱️ ' + t('eta') + ': ~' + etaMinutes + ' ' + t('minutes') })
          : null,
        el('div', { style: 'margin-top:14px' }, [timeline])
      ]),
      el('div.card', {}, order.lines.map(function (line) {
        return el('div.line', {}, [
          el('div.line__qty', { text: line.qty + '×' }),
          el('div.line__body', {}, [
            el('div.line__name', { text: UI.itemName(line.itemId) }),
            el('div.line__opts', { text: UI.optionSummary(line) })
          ]),
          el('div.line__price', { text: money(Store.lineTotal(line)) })
        ]);
      }).concat([
        order.note ? el('div.ticket__note', { text: '📝 ' + order.note }) : null,
        el('div.totals', {}, [
          el('div.totals__row.totals__row--big', {}, [
            el('span', { text: t('total') }), el('span', { text: money(order.total) })
          ]),
          el('div.totals__row.small.muted', {}, [
            el('span', { text: t('payment') }),
            el('span', { text: (order.payment.card || t('pay' + (order.payment.mode === 'cash' ? 'Cash' : 'Tab')))
              + ' · ' + (order.payment.status === 'paid' ? t('paid') : t('open')) })
          ])
        ]),
        el('div.row', { style: 'margin-top:12px' }, [
          order.payment.status !== 'paid' ? el('button.btn.btn--primary', {
            type: 'button', text: t('payNow'), style: 'flex:1',
            onclick: function () {
              if (!Store.device.card) return openCardSheet(function () { render(); });
              runFakePayment(order.total, function () {
                Store.markPaid([order.id], { mode: 'card', card: Store.device.card.last4Label });
                UI.toast(t('paid'), 'good');
              });
            }
          }) : null,
          el('button.btn.btn--ghost', {
            type: 'button', text: '✉️ ' + t('invoice'), style: 'flex:1',
            onclick: function () { openInvoiceSheet([order.id], order.total, null); }
          })
        ])
      ]))
    ]);
  }

  // --- account -------------------------------------------------------------

  function viewAccount() {
    var nameInput, emailInput;
    UI.mount(view, [
      el('h1', { style: 'font-size:1.3rem;margin-bottom:10px', text: t('account') }),
      el('div.card', {}, [
        el('div.field', {}, [
          el('label.field__label', { text: t('cardHolder') }),
          (nameInput = el('input', { type: 'text', value: Store.device.guestName || '',
            placeholder: 'Maria' }))
        ]),
        el('div.field', {}, [
          el('label.field__label', { text: 'E-Mail' }),
          (emailInput = el('input', { type: 'email', value: Store.device.email || '',
            placeholder: t('emailPlaceholder') }))
        ]),
        el('button.btn.btn--primary', {
          type: 'button', text: t('save'),
          onclick: function () {
            Store.saveDevice({ guestName: nameInput.value.trim(), email: emailInput.value.trim() });
            UI.toast(t('save') + ' ✓', 'good');
          }
        })
      ]),
      el('h2.section-title', { text: t('paymentMethod') }),
      el('div.card', {}, Store.device.card ? [
        el('div.card-visual', {}, [
          el('div.card-visual__num', { text: '•••• •••• •••• ' + Store.device.card.last4 }),
          el('div.card-visual__row', {}, [
            el('span', { text: (Store.device.card.holder || '—').toUpperCase() }),
            el('span', { text: Store.device.card.expiry })
          ])
        ]),
        el('p.small.muted', { style: 'margin-top:10px', text: t('cardStored') }),
        el('button.btn.btn--danger.btn--block', {
          type: 'button', text: t('removeCard'),
          onclick: function () { Store.saveDevice({ card: null }); render(); }
        })
      ] : [
        el('p.muted', { text: t('demoNotice') }),
        el('button.btn.btn--primary.btn--block', { type: 'button', text: '＋ ' + t('addCard'),
          onclick: function () { openCardSheet(function () { render(); }); } })
      ]),
      el('h2.section-title', { text: t('umbrella') }),
      el('div.card', {}, [
        el('div.row.row--between', {}, [
          el('span', { text: t('umbrella') + ' ' + (currentUmbrella() || '–') }),
          el('button.btn.btn--ghost.btn--sm', { type: 'button', text: t('save'), onclick: askUmbrella })
        ])
      ]),
      el('p.small.muted.center', { style: 'margin-top:22px' }, [
        document.createTextNode(t('demoNotice') + ' '),
        el('a', { href: 'index.html', text: '← Prototype start' })
      ])
    ]);
  }

  // --- router --------------------------------------------------------------

  function render() {
    var here = UI.route();
    renderChips();
    renderCartBar();
    if (here.indexOf('order/') === 0) viewOrderDetail(here.slice(6));
    else if (here === 'cart') viewCart();
    else if (here === 'orders') viewOrders();
    else if (here === 'account') viewAccount();
    else viewMenu();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function boot() {
    UI.applyLang();
    resolveUmbrella();
    Store.seedDemo();
    renderShell();
    render();
    if (!currentUmbrella()) askUmbrella();

    window.addEventListener('hashchange', render);
    Store.subscribe(function (state, reason) {
      // a status change from the bar should show up here immediately
      if (reason === 'order:status' || reason === 'payment' || reason === 'remote') {
        var here = UI.route();
        if (here.indexOf('order/') === 0 || here === 'orders') render();
      }
    });
    // keep the ETA countdown fresh
    setInterval(function () {
      if (UI.route().indexOf('order/') === 0) render();
    }, 30000);
  }

  boot();
})();

};
</script>
<script>
window.BB_MODULES['bar'] = function () {
/*
 * bar.js — the station behind the counter: incoming tickets, preparation,
 * delivery, music requests, umbrella overview and manual orders.
 */
(function () {
  'use strict';

  var el = UI.el, t = UI.t, tx = UI.tx, money = UI.money;
  var view = UI.$('#view');
  var tabsHost = UI.$('#tabs');

  var LATE_AFTER_MS = 6 * 60000;   // a ticket older than this shouts for help
  var tab = 'orders';
  var umbrellaFilter = 'all';
  var stationFilter = 'all';
  var lastSeenOrderId = null;

  var TABS = [
    { id: 'orders', icon: '🧾', label: function () { return t('orders'); } },
    { id: 'music', icon: '🎵', label: function () { return t('music'); } },
    { id: 'umbrellas', icon: '⛱️', label: function () { return t('umbrellas'); } }
  ];

  var STATIONS = [
    { id: 'all', name: { en: 'All stations', el: 'Όλοι οι σταθμοί' } },
    { id: 'bar', name: { en: 'Bar', el: 'Μπαρ' } },
    { id: 'cocktail', name: { en: 'Cocktails', el: 'Κοκτέιλ' } },
    { id: 'kitchen', name: { en: 'Kitchen', el: 'Κουζίνα' } }
  ];

  // --- shell ---------------------------------------------------------------

  function renderShell() {
    UI.$('#barName').textContent = Store.settings.barName;
    UI.$('#topSub').textContent = t('appBar');
    UI.mount(UI.$('#langHost'), [UI.langToggle(function () { renderShell(); render(); })]);

    var soundBtn = UI.$('#btnSound');
    soundBtn.textContent = Store.device.sound ? '🔔' : '🔕';
    soundBtn.onclick = function () {
      Store.saveDevice({ sound: !Store.device.sound });
      soundBtn.textContent = Store.device.sound ? '🔔' : '🔕';
      if (Store.device.sound) UI.beep();
    };

    UI.mount(tabsHost, TABS.map(function (entry) {
      return el('button.tab', {
        type: 'button', role: 'tab',
        'aria-selected': tab === entry.id ? 'true' : 'false',
        onclick: function () { tab = entry.id; renderShell(); render(); }
      }, [entry.icon + '  ' + entry.label()]);
    }));
  }

  // --- orders board --------------------------------------------------------

  function matchesFilters(order) {
    if (umbrellaFilter !== 'all' && order.umbrella !== Number(umbrellaFilter)) return false;
    if (stationFilter !== 'all') {
      var hit = order.lines.some(function (line) {
        var item = DATA.MENU_BY_ID[line.itemId];
        return item && item.station === stationFilter;
      });
      if (!hit) return false;
    }
    return true;
  }

  function viewOrders() {
    var orders = Store.state.orders.filter(matchesFilters);
    var columns = [
      { status: 'new', title: t('newOrders'), next: t('accept') },
      { status: 'preparing', title: t('inPreparation'), next: t('markReady') },
      { status: 'ready', title: t('ready'), next: t('markServed') },
      { status: 'served', title: t('done'), next: null }
    ];

    var board = el('div.board', {}, columns.map(function (column) {
      var list = orders.filter(function (order) { return order.status === column.status; });
      if (column.status === 'served') list = list.slice(0, 8);
      return el('div.column', {}, [
        el('div.column__head', {}, [
          el('span.column__title', { text: column.title }),
          el('span.column__count', { text: String(list.length) })
        ]),
        el('div.column__list', {}, list.length
          ? list.map(function (order) { return ticket(order, column.next); })
          : [el('p.small.muted', { style: 'padding:6px 4px',
              text: column.status === 'served' ? t('noData') : t('noOpenOrders') })])
      ]);
    }));

    UI.mount(view, [toolbar(), board]);
  }

  function toolbar() {
    var umbrellaSelect = el('select', {
      'aria-label': t('umbrella'),
      style: 'width:auto;min-width:150px',
      onchange: function (event) { umbrellaFilter = event.target.value; render(); }
    }, [el('option', { value: 'all', text: '⛱️ ' + t('allUmbrellas'),
      selected: umbrellaFilter === 'all' })].concat(
      Array.from({ length: Store.settings.umbrellaCount }, function (_, i) {
        return el('option', { value: String(i + 1), text: t('umbrella') + ' ' + (i + 1),
          selected: String(i + 1) === String(umbrellaFilter) });
      })
    ));

    var stationSeg = el('div.seg.seg--plain', { role: 'group' }, STATIONS.map(function (station) {
      return el('button.seg__btn', {
        type: 'button',
        'aria-pressed': stationFilter === station.id ? 'true' : 'false',
        text: tx(station.name),
        onclick: function () { stationFilter = station.id; render(); }
      });
    }));

    var open = Store.openOrders().length;

    return el('div.row.row--wrap', { style: 'margin-bottom:14px;gap:10px' }, [
      el('button.btn.btn--primary', { type: 'button', text: '＋ ' + t('manualOrder'),
        onclick: openManualOrder }),
      umbrellaSelect,
      stationSeg,
      el('span.spacer'),
      el('span.pill', { text: t('openOrders') + ': ' + open })
    ]);
  }

  function ticket(order, nextLabel) {
    var since = Date.now() - (order.acceptedAt || order.createdAt);
    var late = order.status !== 'served' && since > LATE_AFTER_MS;

    return el('article.ticket.ticket--' + order.status + (late ? '.ticket--late' : ''), {}, [
      el('div.ticket__head', {}, [
        el('span.ticket__umbrella', { text: '⛱️ ' + order.umbrella }),
        el('span.ticket__id', { text: order.id }),
        el('span.spacer'),
        el('span.ticket__timer' + (late ? '.is-late' : ''), { text: UI.timeAgo(order.createdAt) })
      ]),
      el('div.ticket__lines', {}, order.lines.map(function (line) {
        var summary = UI.optionSummary(line);
        return el('div.ticket__line', {}, [
          el('b', { text: line.qty + '×' }),
          el('span', {}, [
            el('span', { text: UI.itemName(line.itemId) }),
            summary ? el('span.small.muted', { text: ' — ' + summary }) : null
          ])
        ]);
      })),
      order.note ? el('div.ticket__note', { text: '📝 ' + order.note }) : null,
      el('div.row.row--between.small.muted', {}, [
        el('span', { text: UI.clock(order.createdAt) + ' · ' + (order.channel === 'manual' ? '👤' : '📱') }),
        el('span', {}, [
          el('span.pill.pill--' + (order.payment.status === 'paid' ? 'paid' : 'open'), {
            text: (order.payment.status === 'paid' ? t('paid') : t('open')) +
              (order.payment.card ? ' · ' + order.payment.card : '')
          }),
          document.createTextNode(' '),
          el('b.tabular', { text: money(order.total) })
        ])
      ]),
      el('div.ticket__foot', {}, [
        nextLabel ? el('button.btn.btn--primary.btn--sm', {
          type: 'button', text: nextLabel, style: 'flex:1',
          onclick: function () { Store.advanceOrder(order.id); }
        }) : el('span.small.muted', { text: UI.statusLabel(order.status), style: 'flex:1' }),
        order.status !== 'served' ? el('button.btn.btn--ghost.btn--sm', {
          type: 'button', text: '✕', 'aria-label': t('cancel'),
          onclick: function () {
            UI.confirmSheet(t('cancel') + ' ' + order.id,
              UI.lang() === 'el' ? 'Ακύρωση αυτής της παραγγελίας;' : 'Cancel this order?',
              t('cancel'), function () { Store.cancelOrder(order.id); });
          }
        }) : null,
        order.payment.status !== 'paid' && order.status !== 'served' ? el('button.btn.btn--ghost.btn--sm', {
          type: 'button', text: '💶', 'aria-label': t('paid'),
          onclick: function () {
            Store.markPaid([order.id], { mode: 'cash' });
            UI.toast(t('paid') + ' · ' + order.id, 'good');
          }
        }) : null
      ])
    ]);
  }

  // --- manual order --------------------------------------------------------

  function openManualOrder() {
    var lines = [];
    var umbrella = umbrellaFilter !== 'all' ? Number(umbrellaFilter) : null;
    var payMode = 'cash';
    var category = 'all';
    var cartHost = el('div.card', { style: 'margin-top:12px' });
    var totalLabel = el('span');
    var umbrellaSelect;

    function refreshCart() {
      var total = Store.cartTotal(lines);
      totalLabel.textContent = money(total);
      UI.mount(cartHost, lines.length ? lines.map(function (line, index) {
        return el('div.line', {}, [
          el('div.line__qty', { text: line.qty + '×' }),
          el('div.line__body', {}, [
            el('div.line__name', { text: UI.itemName(line.itemId) }),
            el('div.line__opts', { text: UI.optionSummary(line) })
          ]),
          el('div.line__price', { text: money(Store.lineTotal(line)) }),
          el('button.btn.btn--ghost.btn--sm', { type: 'button', text: '✕',
            'aria-label': t('cancel'),
            onclick: function () { lines.splice(index, 1); refreshCart(); } })
        ]);
      }) : [el('p.small.muted', { text: t('emptyCart') })]);
    }

    function itemButton(item) {
      return el('button.item', { type: 'button', onclick: function () {
        var options = {};
        (item.options || []).forEach(function (groupId) {
          var group = DATA.OPTION_GROUPS[groupId];
          options[groupId] = group.type === 'single' ? [group.choices[0].id] : [];
        });
        if ((item.options || []).length) {
          openOptionPicker(item, options, function (chosen, note) {
            pushLine(item, chosen, note);
          });
        } else {
          pushLine(item, {}, '');
        }
      } }, [
        el('span.item__emoji', { text: item.emoji }),
        el('span.item__body', {}, [
          el('span.item__name', { text: tx(item.name) }),
          el('span.item__desc', { text: money(item.price) })
        ]),
        el('span.item__add', { 'aria-hidden': 'true' }, ['+'])
      ]);
    }

    function pushLine(item, options, note) {
      var line = { itemId: item.id, qty: 1, options: options, note: note || '' };
      var key = Store.lineKey(line);
      var existing = lines.find(function (l) { return Store.lineKey(l) === key; });
      if (existing) existing.qty++; else lines.push(line);
      refreshCart();
    }

    var menuHost = el('div.menu-list');
    function refreshMenu() {
      UI.mount(menuHost, DATA.MENU
        .filter(function (item) { return category === 'all' || item.cat === category; })
        .map(itemButton));
    }

    var catChips = el('div.row.row--wrap', { style: 'gap:6px;margin:10px 0' },
      [{ id: 'all', icon: '🌴', name: { en: 'All', el: 'Όλα' } }].concat(DATA.CATEGORIES)
        .map(function (cat) {
          return el('button.chip', {
            type: 'button', 'aria-pressed': category === cat.id ? 'true' : 'false',
            text: cat.icon + ' ' + tx(cat.name),
            onclick: function () {
              category = cat.id;
              UI.$$('.chip', catChips).forEach(function (chip) {
                chip.setAttribute('aria-pressed', 'false');
              });
              this.setAttribute('aria-pressed', 'true');
              refreshMenu();
            }
          });
        }));

    var paySeg = el('div.seg.seg--plain', { role: 'group' }, [
      { id: 'cash', label: t('payCash') },
      { id: 'card', label: t('card') },
      { id: 'tab', label: t('payTab') }
    ].map(function (choice) {
      return el('button.seg__btn', {
        type: 'button', text: choice.label,
        'aria-pressed': payMode === choice.id ? 'true' : 'false',
        onclick: function () {
          payMode = choice.id;
          UI.$$('.seg__btn', paySeg).forEach(function (btn) { btn.setAttribute('aria-pressed', 'false'); });
          this.setAttribute('aria-pressed', 'true');
        }
      });
    }));

    var ref = UI.sheet({
      wide: true,
      title: '＋ ' + t('manualOrder'),
      content: [
        el('div.field', {}, [
          el('label.field__label', { text: t('umbrella') }),
          (umbrellaSelect = el('select', {
            onchange: function (event) { umbrella = Number(event.target.value) || null; }
          }, [el('option', { value: '', text: '—' })].concat(
            Array.from({ length: Store.settings.umbrellaCount }, function (_, i) {
              return el('option', { value: String(i + 1), text: t('umbrella') + ' ' + (i + 1),
                selected: umbrella === i + 1 });
            })
          )))
        ]),
        catChips,
        menuHost,
        el('h3.section-title', { text: t('cart') }),
        cartHost,
        el('div.row', { style: 'margin-top:12px' }, [
          el('span.field__label', { text: t('paymentMethod') }), paySeg
        ])
      ],
      footer: [
        el('button.btn.btn--ghost', { type: 'button', text: t('cancel'),
          onclick: function () { ref.close(); } }),
        el('button.btn.btn--primary', {
          type: 'button',
          onclick: function () {
            if (!umbrella) { UI.toast(t('umbrella') + '?', 'danger'); umbrellaSelect.focus(); return; }
            if (!lines.length) { UI.toast(t('emptyCart'), 'danger'); return; }
            Store.placeOrder({
              umbrella: umbrella, lines: lines, channel: 'manual', staff: 'bar',
              payment: {
                mode: payMode,
                status: payMode === 'tab' ? 'open' : 'paid',
                card: payMode === 'card' ? '•••• 4242' : null,
                paidAt: payMode === 'tab' ? null : Date.now()
              }
            });
            ref.close();
            UI.toast(t('orderPlaced') + ' · ⛱️ ' + umbrella, 'good');
          }
        }, [el('span', { text: t('orderNow') }), el('span.spacer'), totalLabel])
      ]
    });

    refreshMenu();
    refreshCart();
  }

  function openOptionPicker(item, options, done) {
    var noteInput;
    var body = [];
    (item.options || []).forEach(function (groupId) {
      var group = DATA.OPTION_GROUPS[groupId];
      var list = el('div.opt-list');
      group.choices.forEach(function (choice) {
        list.appendChild(el('label.opt', {}, [
          el('input', {
            type: group.type === 'single' ? 'radio' : 'checkbox',
            name: 'mopt-' + groupId,
            checked: options[groupId].indexOf(choice.id) >= 0,
            onchange: function (event) {
              if (group.type === 'single') options[groupId] = [choice.id];
              else if (event.target.checked) options[groupId].push(choice.id);
              else options[groupId] = options[groupId].filter(function (id) { return id !== choice.id; });
            }
          }),
          el('span.opt__label', { text: tx(choice.name) }),
          choice.delta ? el('span.opt__delta', { text: '+' + money(choice.delta) }) : null
        ]));
      });
      body.push(el('div.opt-group', {}, [
        el('div.opt-group__head', {}, [el('span.opt-group__name', { text: tx(group.name) })]),
        list
      ]));
    });
    body.push(el('div.field', {}, [
      el('label.field__label', { text: t('note') }),
      (noteInput = el('input', { type: 'text', placeholder: t('notePlaceholder') }))
    ]));

    var ref = UI.sheet({
      title: tx(item.name),
      content: body,
      footer: [el('button.btn.btn--primary.btn--block', {
        type: 'button', text: t('add'),
        onclick: function () { ref.close(); done(options, noteInput.value.trim()); }
      })]
    });
  }

  // --- music ---------------------------------------------------------------

  function viewMusic() {
    var requests = Store.state.music;
    UI.mount(view, [
      el('h1', { style: 'font-size:1.2rem;margin-bottom:12px', text: '🎵 ' + t('music') })
    ].concat(requests.length ? requests.map(function (request) {
      return el('div.card', { style: 'margin-bottom:10px' }, [
        el('div.row.row--between', {}, [
          el('div', {}, [
            el('div.card__title', { text: request.text }),
            el('div.small.muted', { text: '⛱️ ' + request.umbrella + ' · ' + UI.clock(request.createdAt) })
          ]),
          el('div.row', {}, request.status === 'new' ? [
            el('button.btn.btn--good.btn--sm', { type: 'button', text: '▶ ' + t('played'),
              onclick: function () { Store.setMusicStatus(request.id, 'played'); } }),
            el('button.btn.btn--ghost.btn--sm', { type: 'button', text: t('decline'),
              onclick: function () { Store.setMusicStatus(request.id, 'declined'); } })
          ] : [el('span.pill', { text: request.status === 'played' ? t('played') : t('decline') })])
        ])
      ]);
    }) : [el('div.empty', {}, [
      el('span.empty__emoji', { text: '🎧' }), el('p', { text: t('noData') })
    ])]));
  }

  // --- umbrellas -----------------------------------------------------------

  function viewUmbrellas() {
    var count = Store.settings.umbrellaCount;
    var byUmbrella = {};
    Store.state.orders.forEach(function (order) {
      if (order.status === 'cancelled') return;
      var entry = byUmbrella[order.umbrella] || (byUmbrella[order.umbrella] = { total: 0, open: 0, tab: 0 });
      entry.total += order.total;
      if (order.status !== 'served') entry.open++;
      if (order.payment.status !== 'paid') entry.tab += order.total;
    });

    var grid = el('div.umb-grid', {}, Array.from({ length: count }, function (_, index) {
      var no = index + 1;
      var entry = byUmbrella[no];
      return el('button.umb' + (entry && entry.open ? '.is-active' : ''), {
        type: 'button',
        dataset: { heat: entry ? String(Math.min(4, Math.ceil(entry.total / 25))) : '0' },
        onclick: function () { umbrellaFilter = String(no); tab = 'orders'; renderShell(); render(); }
      }, [
        el('span', { text: String(no) }),
        entry ? el('span.umb__sub', { text: money(entry.total) }) : null,
        entry && entry.open ? el('span.umb__sub', { text: '● ' + entry.open }) : null
      ]);
    }));

    UI.mount(view, [
      el('h1', { style: 'font-size:1.2rem;margin-bottom:6px', text: '⛱️ ' + t('umbrellas') }),
      el('p.small.muted', { text: UI.lang() === 'el'
        ? 'Πατήστε μια ομπρέλα για τις παραγγελίες της. Το χρώμα δείχνει τον τζίρο.'
        : 'Tap an umbrella to filter its orders. Colour shows revenue.' }),
      el('div.card', {}, [grid]),
      el('div.row.row--wrap', { style: 'margin-top:10px;gap:12px' }, [
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:var(--surface-2)' }), t('noData')]),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#cde2fb' }), '< 25 €']),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#5598e7' }), '< 75 €']),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#256abf' }), '≥ 75 €'])
      ])
    ]);
  }

  // --- router --------------------------------------------------------------

  function render() {
    if (tab === 'music') viewMusic();
    else if (tab === 'umbrellas') viewUmbrellas();
    else viewOrders();
  }

  function boot() {
    UI.applyLang();
    Store.seedDemo();
    var newest = Store.state.orders[0];
    lastSeenOrderId = newest ? newest.id : null;

    renderShell();
    render();

    Store.subscribe(function (state, reason) {
      if (reason === 'order:new' || reason === 'remote') {
        var latest = state.orders[0];
        if (latest && latest.id !== lastSeenOrderId && latest.status === 'new') {
          lastSeenOrderId = latest.id;
          UI.beep();
          UI.toast('⛱️ ' + latest.umbrella + ' · ' + t('newOrders'), 'good');
        }
      }
      render();
    });

    // keep the waiting timers moving
    setInterval(function () { if (tab === 'orders') render(); }, 15000);
  }

  boot();
})();

};
</script>
<script>
window.BB_MODULES['dashboard'] = function () {
/*
 * dashboard.js — live numbers for the bar owner.
 *
 * Charts are hand-rolled SVG so the page stays dependency free. Colours come
 * from the validated categorical palette in app.css (--series-1 … --series-6).
 */
(function () {
  'use strict';

  var el = UI.el, t = UI.t, tx = UI.tx, money = UI.money;
  var view = UI.$('#view');
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var showTables = false;

  function svg(tag, attrs, children) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'text') node.textContent = attrs[key];
      else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), attrs[key]);
      else node.setAttribute(key, attrs[key]);
    });
    [].concat(children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  // --- aggregation ---------------------------------------------------------

  function startOfToday() {
    var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
  }

  function stats() {
    var today = startOfToday();
    var orders = Store.state.orders.filter(function (order) {
      return order.createdAt >= today && order.status !== 'cancelled';
    });

    var revenue = 0, prepTimes = [], byHour = {}, byItem = {}, byCategory = {}, byUmbrella = {};
    var openTabTotal = 0, openTabs = {};

    orders.forEach(function (order) {
      revenue += order.total;

      var hour = new Date(order.createdAt).getHours();
      byHour[hour] = (byHour[hour] || 0) + order.total;
      byUmbrella[order.umbrella] = (byUmbrella[order.umbrella] || 0) + order.total;

      if (order.readyAt && order.acceptedAt) {
        prepTimes.push((order.readyAt - order.createdAt) / 60000);
      }
      if (order.payment.status !== 'paid') {
        openTabTotal += order.total;
        openTabs[order.umbrella] = (openTabs[order.umbrella] || 0) + order.total;
      }
      order.lines.forEach(function (line) {
        var item = DATA.MENU_BY_ID[line.itemId];
        if (!item) return;
        var value = Store.lineTotal(line);
        var entry = byItem[line.itemId] || (byItem[line.itemId] = { qty: 0, revenue: 0 });
        entry.qty += line.qty;
        entry.revenue += value;
        byCategory[item.cat] = (byCategory[item.cat] || 0) + value;
      });
    });

    return {
      orders: orders,
      revenue: Store.round2(revenue),
      count: orders.length,
      avgTicket: orders.length ? Store.round2(revenue / orders.length) : 0,
      openOrders: Store.openOrders().length,
      activeUmbrellas: Object.keys(byUmbrella).length,
      avgPrep: prepTimes.length
        ? Math.round(prepTimes.reduce(function (a, b) { return a + b; }, 0) / prepTimes.length)
        : 0,
      byHour: byHour,
      byItem: byItem,
      byCategory: byCategory,
      byUmbrella: byUmbrella,
      openTabTotal: Store.round2(openTabTotal),
      openTabs: openTabs
    };
  }

  // --- KPI tiles -----------------------------------------------------------

  function kpi(label, value, hint) {
    return el('div.kpi', {}, [
      el('div.kpi__label', { text: label }),
      el('div.kpi__value', { text: value }),
      hint ? el('div.kpi__hint', { text: hint }) : null
    ]);
  }

  // --- revenue by hour (vertical bars, one series) -------------------------

  function revenueByHourChart(data) {
    // the axis follows the data: opening hour of the day so far … current hour
    var present = Object.keys(data.byHour).map(Number).sort(function (a, b) { return a - b; });
    var first = present.length ? Math.min(present[0], new Date().getHours()) : 9;
    var last = Math.max(present.length ? present[present.length - 1] : 18, new Date().getHours());
    if (last - first < 5) last = first + 5;

    var hours = [];
    for (var h = first; h <= last; h++) hours.push(h);
    var values = hours.map(function (hour) { return Store.round2(data.byHour[hour] || 0); });
    var max = Math.max(10, Math.max.apply(null, values));

    var W = 640, H = 220, padL = 44, padR = 8, padT = 12, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var slot = plotW / hours.length;
    var barW = Math.max(6, slot - 8);

    var children = [];
    // recessive gridlines + y axis labels
    [0, 0.5, 1].forEach(function (ratio) {
      var y = padT + plotH - ratio * plotH;
      children.push(svg('line', { x1: padL, x2: W - padR, y1: y, y2: y, class: 'grid-line' }));
      children.push(svg('text', {
        x: padL - 8, y: y + 3, 'text-anchor': 'end', class: 'axis-label',
        text: money(max * ratio).replace(/[.,]00/, '')
      }));
    });

    hours.forEach(function (hour, index) {
      var value = values[index];
      var barH = max ? (value / max) * plotH : 0;
      var x = padL + index * slot + (slot - barW) / 2;
      var y = padT + plotH - barH;
      var title = svg('title', { text: hour + ':00 — ' + money(value) });
      if (barH > 0) {
        children.push(svg('rect', {
          x: x, y: y, width: barW, height: Math.max(2, barH),
          rx: 4, fill: 'var(--series-1)'
        }, [title]));
      } else {
        children.push(svg('rect', {
          x: x, y: padT + plotH - 2, width: barW, height: 2, rx: 1, class: 'bar-track'
        }, [title]));
      }
      if (index % 2 === 0) {
        children.push(svg('text', {
          x: x + barW / 2, y: H - 8, 'text-anchor': 'middle', class: 'axis-label',
          text: String(hour).padStart(2, '0') + ':00'
        }));
      }
    });

    return el('div.chart', {}, [
      svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H,
        role: 'img', 'aria-label': t('revenueByHour') }, children)
    ]);
  }

  // --- top products (horizontal bars, direct labels) ----------------------

  function topItemsChart(data) {
    var rows = Object.keys(data.byItem).map(function (itemId) {
      return { id: itemId, qty: data.byItem[itemId].qty, revenue: data.byItem[itemId].revenue };
    }).sort(function (a, b) { return b.revenue - a.revenue; }).slice(0, 8);

    if (!rows.length) return el('p.muted', { text: t('noData') });
    var max = rows[0].revenue;

    return el('div.hbar', {}, rows.map(function (row) {
      return el('div.hbar__row', {}, [
        el('span.hbar__name', { text: UI.itemName(row.id), title: UI.itemName(row.id) }),
        el('span.hbar__track', {}, [
          el('span.hbar__fill', { style: 'width:' + Math.max(2, (row.revenue / max) * 100) + '%' })
        ]),
        el('span.hbar__value', { text: money(row.revenue) + '  ·  ' + row.qty + '×' })
      ]);
    }));
  }

  // --- category share (stacked bar + legend) -------------------------------

  function categoryChart(data) {
    var total = Object.keys(data.byCategory).reduce(function (sum, key) {
      return sum + data.byCategory[key];
    }, 0);
    if (!total) return el('p.muted', { text: t('noData') });

    var segments = DATA.CATEGORIES.map(function (cat, index) {
      return {
        id: cat.id,
        name: tx(cat.name),
        value: data.byCategory[cat.id] || 0,
        color: 'var(--series-' + (index + 1) + ')'
      };
    }).filter(function (segment) { return segment.value > 0; });

    return el('div', {}, [
      el('div.stackbar', {}, segments.map(function (segment) {
        return el('span.stackbar__seg', {
          style: 'background:' + segment.color + ';width:' + (segment.value / total * 100) + '%',
          title: segment.name + ': ' + money(segment.value)
        });
      })),
      el('div.legend', {}, segments.map(function (segment) {
        return el('span.legend__item', {}, [
          el('span.legend__swatch', { style: 'background:' + segment.color }),
          segment.name + ' · ' + money(segment.value) +
            ' (' + Math.round(segment.value / total * 100) + '%)'
        ]);
      }))
    ]);
  }

  // --- umbrella revenue map (sequential ramp) ------------------------------

  function umbrellaMap(data) {
    var count = Store.settings.umbrellaCount;
    var values = Object.keys(data.byUmbrella).map(function (key) { return data.byUmbrella[key]; });
    var max = values.length ? Math.max.apply(null, values) : 0;

    var grid = el('div.umb-grid', {}, Array.from({ length: count }, function (_, index) {
      var no = index + 1;
      var value = data.byUmbrella[no] || 0;
      var heat = !value ? 0 : Math.min(4, Math.max(1, Math.ceil((value / max) * 4)));
      return el('div.umb', {
        dataset: { heat: String(heat) },
        title: t('umbrella') + ' ' + no + ': ' + money(value)
      }, [
        el('span', { text: String(no) }),
        value ? el('span.umb__sub', { text: money(value).replace(/[.,]00/, '') }) : null
      ]);
    }));

    return el('div', {}, [
      grid,
      el('div.legend', {}, [
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:var(--surface-1);border:1px solid var(--border)' }), t('noData')]),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#cde2fb' }), '≤ ' + money(max * 0.25)]),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#9ec5f4' }), '≤ ' + money(max * 0.5)]),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#5598e7' }), '≤ ' + money(max * 0.75)]),
        el('span.legend__item', {}, [el('span.legend__swatch', { style: 'background:#256abf' }), '≤ ' + money(max)])
      ])
    ]);
  }

  // --- tables (the accessible twin of every chart) -------------------------

  function tableFor(rows, headers) {
    return el('div.table-wrap', {}, [
      el('table.data', {}, [
        el('thead', {}, [el('tr', {}, headers.map(function (head, index) {
          return el('th' + (index ? '.num' : ''), { text: head });
        }))]),
        el('tbody', {}, rows.map(function (row) {
          return el('tr', {}, row.map(function (cell, index) {
            return el('td' + (index ? '.num' : ''), { text: String(cell) });
          }));
        }))
      ])
    ]);
  }

  // --- CSV -----------------------------------------------------------------

  function exportCsv() {
    var header = ['order_id', 'created_at', 'umbrella', 'channel', 'status', 'payment_mode',
      'payment_status', 'item', 'options', 'qty', 'unit_price', 'line_total'];
    var rows = [header];
    Store.state.orders.forEach(function (order) {
      order.lines.forEach(function (line) {
        rows.push([
          order.id,
          new Date(order.createdAt).toISOString(),
          order.umbrella,
          order.channel,
          order.status,
          order.payment.mode,
          order.payment.status,
          UI.itemName(line.itemId),
          UI.optionSummary(line).replace(/;/g, ','),
          line.qty,
          Store.unitPrice(line.itemId, line.options).toFixed(2),
          Store.lineTotal(line).toFixed(2)
        ]);
      });
    });
    var csv = rows.map(function (row) {
      return row.map(function (cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = el('a', { href: url, download: 'beachbar-orders.csv' });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // --- render --------------------------------------------------------------

  function render() {
    var data = stats();

    var topRows = Object.keys(data.byItem).map(function (itemId) {
      return [UI.itemName(itemId), data.byItem[itemId].qty, money(data.byItem[itemId].revenue)];
    }).sort(function (a, b) { return b[1] - a[1]; });

    var hourRows = Object.keys(data.byHour).sort(function (a, b) { return a - b; })
      .map(function (hour) { return [hour + ':00', money(data.byHour[hour])]; });

    var tabRows = Object.keys(data.openTabs).map(function (umbrella) {
      return ['⛱️ ' + umbrella, money(data.openTabs[umbrella])];
    });

    UI.mount(view, [
      el('div.row.row--between.row--wrap', { style: 'margin-bottom:14px' }, [
        el('h1', { style: 'font-size:1.3rem', text: t('dashboard') }),
        el('div.row.row--wrap', {}, [
          el('div.seg.seg--plain', { role: 'group' }, [
            el('button.seg__btn', { type: 'button', text: t('chartView'),
              'aria-pressed': showTables ? 'false' : 'true',
              onclick: function () { showTables = false; render(); } }),
            el('button.seg__btn', { type: 'button', text: t('tableView'),
              'aria-pressed': showTables ? 'true' : 'false',
              onclick: function () { showTables = true; render(); } })
          ]),
          el('button.btn.btn--ghost.btn--sm', { type: 'button', text: '⬇ ' + t('exportCsv'),
            onclick: exportCsv }),
          el('button.btn.btn--ghost.btn--sm', { type: 'button', text: '↺ ' + t('resetDemo'),
            onclick: function () {
              UI.confirmSheet(t('resetDemo'), UI.lang() === 'el'
                ? 'Όλες οι παραγγελίες θα αντικατασταθούν από δεδομένα επίδειξης.'
                : 'All orders will be replaced by demo data.', t('resetDemo'), function () {
                  Store.resetAll(); render();
                });
            } })
        ])
      ]),

      el('div.kpis', {}, [
        kpi(t('revenueToday'), money(data.revenue), data.count + ' ' + t('orders')),
        kpi(t('ordersToday'), String(data.count),
          Math.round(data.orders.filter(function (o) { return o.channel === 'qr'; }).length /
            Math.max(1, data.count) * 100) + '% QR'),
        kpi(t('avgTicket'), money(data.avgTicket)),
        kpi(t('openOrders'), String(data.openOrders)),
        kpi(t('activeUmbrellas'), data.activeUmbrellas + ' / ' + Store.settings.umbrellaCount),
        kpi(t('avgPrepTime'), data.avgPrep + ' ' + t('minutes')),
        kpi(t('openTabs'), money(data.openTabTotal),
          Object.keys(data.openTabs).length + ' ⛱️')
      ]),

      el('div.grid-2', { style: 'margin-top:14px' }, [
        el('div.card', {}, [
          el('h2.card__title', { text: t('revenueByHour') }),
          el('div', { style: 'margin-top:10px' }, [
            showTables ? tableFor(hourRows, [t('revenueByHour'), t('total')])
                       : revenueByHourChart(data)
          ])
        ]),
        el('div.card', {}, [
          el('h2.card__title', { text: t('topItems') }),
          el('div', { style: 'margin-top:10px' }, [
            showTables ? tableFor(topRows, [t('topItems'), 'Qty', t('total')])
                       : topItemsChart(data)
          ])
        ]),
        el('div.card', {}, [
          el('h2.card__title', { text: t('categoryShare') }),
          el('div', { style: 'margin-top:10px' }, [categoryChart(data)])
        ]),
        el('div.card', {}, [
          el('h2.card__title', { text: t('openTabs') }),
          el('div', { style: 'margin-top:10px' }, [
            tabRows.length ? tableFor(tabRows, [t('umbrella'), t('total')])
                           : el('p.muted', { text: t('noData') })
          ])
        ])
      ]),

      el('div.card', { style: 'margin-top:14px' }, [
        el('h2.card__title', { text: t('umbrellaMap') }),
        el('div', { style: 'margin-top:10px' }, [umbrellaMap(data)])
      ]),

      el('div.card', { style: 'margin-top:14px' }, [
        el('h2.card__title', { text: '🎵 ' + t('music') }),
        el('div', { style: 'margin-top:10px' }, [
          Store.state.music.length
            ? tableFor(Store.state.music.slice(0, 10).map(function (request) {
                return [request.text, '⛱️ ' + request.umbrella, UI.clock(request.createdAt)];
              }), [t('musicWish'), t('umbrella'), '⏱'])
            : el('p.muted', { text: t('noData') })
        ])
      ]),

      el('div.card', { style: 'margin-top:14px' }, [
        el('h2.card__title', { text: '✉️ ' + t('sentInvoices') }),
        el('div', { style: 'margin-top:10px' }, [
          Store.state.invoices.length
            ? tableFor(Store.state.invoices.slice(0, 10).map(function (invoice) {
                return [invoice.id + ' · ' + invoice.email, '⛱️ ' + invoice.umbrella,
                  money(invoice.total)];
              }), ['E-Mail', t('umbrella'), t('total')])
            : el('p.muted', { text: t('noData') })
        ])
      ]),

      el('p.small.muted.center', { style: 'margin-top:22px', text: t('demoNotice') })
    ]);
  }

  function boot() {
    UI.applyLang();
    Store.seedDemo();
    UI.$('#barName').textContent = Store.settings.barName;
    UI.$('#topSub').textContent = t('dashboard');
    UI.mount(UI.$('#langHost'), [UI.langToggle(function () {
      UI.$('#topSub').textContent = t('dashboard');
      render();
    })]);
    render();
    Store.subscribe(render);
    setInterval(render, 30000);
  }

  boot();
})();

};
</script>
<script>
window.BB_MODULES['qr'] = function () {
/*
 * qr.js — printable QR labels, one per umbrella.
 *
 * Every code encodes <base>/guest.html?u=<number>, so the scanned umbrella is
 * known before the guest touches anything. The base URL is editable: put in the
 * address the phones can actually reach (LAN IP during a test, the real domain
 * later) and reprint.
 */
(function () {
  'use strict';

  var el = UI.el, t = UI.t;
  var view = UI.$('#view');

  /* Codes have to carry an address a phone camera can actually open. Opened
     from a file viewer or a blob the page has no such address (about:blank,
     blob:, file:), so we offer a placeholder to overwrite instead of baking
     nonsense into 40 printed labels. */
  var PLACEHOLDER = 'https://beachbar.example.com';

  function hostIsAddressable() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  function defaultBase() {
    if (!hostIsAddressable()) return PLACEHOLDER;
    // single file: the page itself is the app; pages: the folder holding them
    if (UI.single) return location.href.split('#')[0];
    return location.href.replace(/[^/]*$/, '').replace(/\/$/, '');
  }

  var base = Store.storage.getItem('bb.qrbase') || defaultBase();
  var from = 1;
  var to = Store.settings.umbrellaCount;

  function urlFor(number) {
    if (UI.single) return base.split('#')[0] + '#guest?u=' + number;
    return base.replace(/\/$/, '') + '/guest.html?u=' + number;
  }

  function card(number) {
    var wrap = el('div.qr-card', {}, [
      el('div.qr-card__bar', { text: Store.settings.barName }),
      el('div', { html: QR.svg(urlFor(number), { quiet: 2 }) }),
      el('div.qr-card__no', { text: '⛱️ ' + number }),
      el('div.qr-card__label', { text: UI.lang() === 'el'
        ? 'Σαρώστε & παραγγείλτε' : 'Scan & order' })
    ]);
    return wrap;
  }

  function downloadSvg(number) {
    var markup = QR.svg(urlFor(number), { quiet: 2 });
    var blob = new Blob([markup], { type: 'image/svg+xml' });
    var url = URL.createObjectURL(blob);
    var link = el('a', { href: url, download: 'umbrella-' + number + '.svg' });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function render() {
    var baseInput, fromInput, toInput;
    var grid = el('div.qr-grid');

    function refreshGrid() {
      var cards = [];
      for (var n = from; n <= to; n++) cards.push(card(n));
      UI.mount(grid, cards);
    }

    UI.mount(view, [
      el('div.card.no-print', {}, [
        el('h1', { style: 'font-size:1.15rem;margin-bottom:4px',
          text: UI.lang() === 'el' ? 'Κωδικοί QR ομπρελών' : 'Umbrella QR codes' }),
        el('p.small.muted', { text: UI.lang() === 'el'
          ? 'Ο κωδικός ανοίγει την εφαρμογή με τον αριθμό της ομπρέλας.'
          : 'Each code opens the guest app with its umbrella number pre-selected.' }),
        hostIsAddressable() ? null : el('div.notice.notice--warn', { text: UI.lang() === 'el'
          ? 'Η σελίδα δεν έχει διεύθυνση που μπορεί να σαρωθεί. Γράψτε τη διεύθυνση '
            + 'στην οποία θα φιλοξενηθεί η εφαρμογή.'
          : 'This page has no scannable address of its own. Enter the address the '
            + 'app will be hosted at, otherwise the codes lead nowhere.' }),
        el('div.field', {}, [
          el('label.field__label', { text: 'Base URL' }),
          (baseInput = el('input', { type: 'text', value: base,
            placeholder: 'https://bar.example.com/beachbar' }))
        ]),
        el('div.row', {}, [
          el('div.field', { style: 'flex:1' }, [
            el('label.field__label', { text: 'From' }),
            (fromInput = el('input', { type: 'number', min: '1', value: String(from) }))
          ]),
          el('div.field', { style: 'flex:1' }, [
            el('label.field__label', { text: 'To' }),
            (toInput = el('input', { type: 'number', min: '1', value: String(to) }))
          ])
        ]),
        el('div.row.row--wrap', {}, [
          el('button.btn.btn--primary', {
            type: 'button', text: UI.lang() === 'el' ? 'Δημιουργία' : 'Generate',
            onclick: function () {
              base = baseInput.value.trim() || defaultBase();
              Store.storage.setItem('bb.qrbase', base);
              from = Math.max(1, Number(fromInput.value) || 1);
              to = Math.max(from, Math.min(200, Number(toInput.value) || from));
              refreshGrid();
              UI.toast((to - from + 1) + ' QR', 'good');
            }
          }),
          el('button.btn.btn--ghost', { type: 'button', text: '🖨 Print',
            onclick: function () { window.print(); } }),
          el('button.btn.btn--ghost', { type: 'button', text: '⬇ SVG (⛱️ ' + from + ')',
            onclick: function () { downloadSvg(from); } })
        ]),
        el('p.small.muted', { style: 'margin-top:8px', text: urlFor(from) })
      ]),
      grid
    ]);

    refreshGrid();
  }

  UI.applyLang();
  UI.mount(UI.$('#langHost'), [UI.langToggle(render)]);
  render();
})();

};
</script>
<script>
/* Router. Roles are swapped in place — never by reloading: in-app file viewers
   and sandboxed previews block reloads, and a demo that dies on the first tap
   is worse than useless. Each role's intervals, window listeners and store
   subscriptions are tracked while it boots, so switching away disposes of them
   and the next role starts as cleanly as it would on a fresh page. */
(function () {
  var ROLES = ["index", "guest", "bar", "dashboard", "qr"];

  function roleFrom(hash) {
    var role = (hash || '').replace(/^#/, '').split(/[\/?]/)[0];
    return ROLES.indexOf(role) >= 0 ? role : 'index';
  }

  var booted = null;
  var disposers = [];

  function onHashChange() {
    var next = roleFrom(UI.hash());
    if (next !== booted) boot(next);
  }
  window.addEventListener('hashchange', onHashChange);

  // from here on, everything a role registers is disposable
  var nativeSetInterval = window.setInterval;
  window.setInterval = function (fn, ms) {
    var id = nativeSetInterval(fn, ms);
    disposers.push(function () { clearInterval(id); });
    return id;
  };
  var nativeAddListener = window.addEventListener;
  window.addEventListener = function (type, fn, options) {
    nativeAddListener.call(window, type, fn, options);
    disposers.push(function () { window.removeEventListener(type, fn, options); });
  };
  var nativeSubscribe = Store.subscribe;
  Store.subscribe = function (fn) {
    var off = nativeSubscribe(fn);
    disposers.push(off);
    return off;
  };

  function boot(role) {
    disposers.forEach(function (dispose) {
      try { dispose(); } catch (err) { /* keep tearing down */ }
    });
    disposers = [];

    booted = role;
    document.documentElement.lang = 'en';
    var markup = document.getElementById('bb-body-' + role);
    document.body.dataset.app = markup.dataset.app;
    document.body.classList.remove('is-locked');
    document.getElementById('bb-root').innerHTML = markup.textContent;
    if (window.BB_MODULES[role]) window.BB_MODULES[role]();
    window.scrollTo(0, 0);
  }

  /* Handle in-page links ourselves: if the host swallows fragment navigation,
     the browser's default would do nothing at all. */
  document.addEventListener('click', function (event) {
    if (event.defaultPrevented || event.button) return;
    var link = event.target.closest && event.target.closest('a[href^="#"]');
    if (!link) return;
    event.preventDefault();
    UI.setHash(link.getAttribute('href'));
    onHashChange();
  });

  boot(roleFrom(UI.hash()));
})();
</script>
