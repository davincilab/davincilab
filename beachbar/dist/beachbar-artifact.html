<title>Blue Wave Beach Bar</title>
<style>
/* ============================================================
   Beach Bar prototype — shared stylesheet
   Light/dark aware. Brand colour comes from body[data-app].
   ============================================================ */

:root {
  color-scheme: light;

  --surface-0: #f4f6f8;
  --surface-1: #ffffff;
  --surface-2: #eef1f5;
  --surface-3: #e2e7ee;
  --border: #d8dee7;
  --border-strong: #c3ccd8;

  --text-primary: #10151c;
  --text-secondary: #4a5666;
  --text-muted: #77839380;

  --brand: #2a78d6;
  --brand-ink: #ffffff;
  --brand-soft: #e7f0fd;
  --brand-strong: #1c5cab;

  --good: #0b7a4b;
  --warn: #b06b00;
  --danger: #c2312f;
  --good-soft: #e2f4ea;
  --warn-soft: #fdf0d9;
  --danger-soft: #fbe6e5;

  /* categorical data-viz slots (validated palette, light steps) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-1: 0 1px 2px rgb(16 21 28 / 6%), 0 2px 8px rgb(16 21 28 / 6%);
  --shadow-2: 0 8px 30px rgb(16 21 28 / 14%);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #0e1319;
    --surface-1: #161c24;
    --surface-2: #1d242e;
    --surface-3: #263041;
    --border: #2b3543;
    --border-strong: #3b4757;
    --text-primary: #f2f5f8;
    --text-secondary: #a9b6c6;
    --text-muted: #8b98a880;
    --brand: #3987e5;
    --brand-soft: #16273f;
    --brand-strong: #6da7ec;
    --good: #35b47a;
    --warn: #e0a13a;
    --danger: #e66767;
    --good-soft: #12301f;
    --warn-soft: #33260f;
    --danger-soft: #351b1b;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #2f9e2f;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 40%), 0 2px 10px rgb(0 0 0 / 30%);
    --shadow-2: 0 10px 34px rgb(0 0 0 / 55%);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #0e1319;
  --surface-1: #161c24;
  --surface-2: #1d242e;
  --surface-3: #263041;
  --border: #2b3543;
  --border-strong: #3b4757;
  --text-primary: #f2f5f8;
  --text-secondary: #a9b6c6;
  --text-muted: #8b98a880;
  --brand: #3987e5;
  --brand-soft: #16273f;
  --brand-strong: #6da7ec;
  --good: #35b47a;
  --warn: #e0a13a;
  --danger: #e66767;
  --good-soft: #12301f;
  --warn-soft: #33260f;
  --danger-soft: #351b1b;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #2f9e2f;
  --shadow-1: 0 1px 2px rgb(0 0 0 / 40%), 0 2px 10px rgb(0 0 0 / 30%);
  --shadow-2: 0 10px 34px rgb(0 0 0 / 55%);
}

/* the bar station and the dashboard wear the red app colour */
body[data-app="bar"] {
  --brand: #d4403f;
  --brand-strong: #a92a29;
  --brand-soft: #fbe9e8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body[data-app="bar"] {
    --brand: #e66767; --brand-strong: #f19191; --brand-soft: #3a1e1e;
  }
}
:root[data-theme="dark"] body[data-app="bar"] {
  --brand: #e66767; --brand-strong: #f19191; --brand-soft: #3a1e1e;
}

* { box-sizing: border-box; }

/* min-height, never a fixed height: hosts that size a frame to the document
   (in-app file viewers) would otherwise measure exactly one screen and clip
   everything below it, with nothing left to scroll */
html, body { min-height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--surface-0);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body.is-locked { overflow: hidden; }

h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.2; }
p { margin: 0 0 .6em; }
a { color: var(--brand); }

.muted { color: var(--text-secondary); }
.small { font-size: .85rem; }
.tabular { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* ---------- app shell ---------- */

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  background: var(--brand);
  color: #fff;
  box-shadow: var(--shadow-1);
}

.topbar__title {
  font-size: 1rem; font-weight: 650; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__sub {
  font-size: .78rem; opacity: .85;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.badge-umbrella {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 6px;
  border-radius: 999px;
  background: rgb(255 255 255 / 18%);
  font-weight: 700;
  font-size: .9rem;
}
.badge-umbrella b { font-size: 1.05rem; }

.main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px; }
.main--wide { max-width: 1500px; }
.main--guest { padding-bottom: 120px; }

/* ---------- buttons ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface-1);
  color: var(--text-primary);
  font: inherit;
  font-weight: 600;
  padding: 11px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .06s ease, background .15s ease, border-color .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn--ghost { background: transparent; border-color: var(--border); }
.btn--danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.btn--good { background: var(--good); border-color: var(--good); color: #fff; }
.btn--block { width: 100%; }
.btn--sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.icon-btn {
  appearance: none;
  border: 0;
  background: rgb(255 255 255 / 16%);
  color: inherit;
  width: 38px; height: 38px;
  border-radius: 12px;
  font-size: 1.05rem;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: rgb(255 255 255 / 28%); }
.sheet__head .icon-btn { background: var(--surface-2); color: var(--text-secondary); }

.seg {
  display: inline-flex;
  background: rgb(255 255 255 / 16%);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg__btn {
  appearance: none; border: 0; background: transparent; color: inherit;
  font: inherit; font-size: .8rem; font-weight: 700;
  padding: 5px 11px; border-radius: 999px; cursor: pointer; min-height: 32px;
}
.seg__btn[aria-pressed="true"] { background: #fff; color: var(--brand-strong); }

.seg--plain { background: var(--surface-2); }
.seg--plain .seg__btn[aria-pressed="true"] { background: var(--brand); color: #fff; }

/* ---------- cards & lists ---------- */

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: 16px;
}
.card--flat { box-shadow: none; }
.card__title { font-size: .95rem; font-weight: 650; }

.section-title {
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-secondary);
  font-weight: 700;
  margin: 22px 2px 8px;
}

.empty {
  text-align: center;
  padding: 40px 18px;
  color: var(--text-secondary);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  background: var(--surface-1);
}
.empty__emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-secondary);
  white-space: nowrap;
}
.pill--new { background: var(--brand-soft); color: var(--brand-strong); }
.pill--preparing { background: var(--warn-soft); color: var(--warn); }
.pill--ready { background: var(--good-soft); color: var(--good); }
.pill--served { background: var(--surface-2); color: var(--text-secondary); }
.pill--cancelled { background: var(--danger-soft); color: var(--danger); }
.pill--paid { background: var(--good-soft); color: var(--good); }
.pill--open { background: var(--warn-soft); color: var(--warn); }

/* ---------- guest: category chips ---------- */

.chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px;
  position: sticky; top: 56px; z-index: 20;
  background: var(--surface-0);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary);
  font: inherit; font-size: .88rem; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; white-space: nowrap; cursor: pointer;
  min-height: 40px;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---------- guest: menu items ---------- */

.menu-list { display: grid; gap: 10px; }
@media (min-width: 720px) {
  .menu-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1080px) {
  .menu-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  text-align: left;
  width: 100%;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.item:hover { border-color: var(--brand); }
.item__emoji {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  background: var(--surface-2); border-radius: 12px; font-size: 1.4rem;
}
.item__body { flex: 1; min-width: 0; }
.item__name { display: block; font-weight: 650; }
.item__desc {
  display: block;
  font-size: .82rem; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item__price { font-weight: 700; font-variant-numeric: tabular-nums; }
.item__add {
  width: 38px; height: 38px; flex: none; border-radius: 12px;
  background: var(--brand); color: #fff; border: 0;
  font-size: 1.3rem; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}

/* ---------- options ---------- */

.opt-group { margin-bottom: 18px; }
.opt-group__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.opt-group__name { font-weight: 650; }
.opt-list { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 14px; cursor: pointer; min-height: 48px;
  background: var(--surface-1);
}
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.opt input { accent-color: var(--brand); width: 20px; height: 20px; flex: none; }
.opt__label { flex: 1; }
.opt__delta { font-size: .85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field__label { font-size: .82rem; font-weight: 650; color: var(--text-secondary); }
input[type="text"], input[type="email"], input[type="number"], input[type="tel"],
select, textarea {
  font: inherit; color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: 12px; padding: 11px 12px; width: 100%; min-height: 46px;
}
textarea { min-height: 74px; resize: vertical; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand);
}

.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border-strong);
  background: var(--surface-1); color: var(--text-primary); font-size: 1.2rem; cursor: pointer;
}
.stepper output { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- guest: cart bar ---------- */

.cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  transform: translateY(120%);
  transition: transform .22s ease;
}
.cartbar.is-visible { transform: none; }
.cartbar__inner { max-width: 1180px; margin: 0 auto; }

.line {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.line:last-child { border-bottom: 0; }
.line__qty {
  min-width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft);
  color: var(--brand-strong); font-weight: 700; display: grid; place-items: center;
  font-size: .85rem; padding: 0 6px;
}
.line__body { flex: 1; min-width: 0; }
.line__name { font-weight: 600; }
.line__opts { font-size: .82rem; color: var(--text-secondary); }
.line__price { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }

.totals { display: grid; gap: 6px; margin-top: 12px; }
.totals__row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.totals__row--big { font-size: 1.15rem; font-weight: 700; }

/* ---------- timeline ---------- */

.timeline { display: grid; gap: 0; margin: 6px 0; }
.tl-step { display: flex; gap: 12px; align-items: flex-start; }
.tl-step__dot {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 2px solid var(--border-strong); background: var(--surface-1);
  display: grid; place-items: center; font-size: .7rem; color: #fff;
}
.tl-step.is-done .tl-step__dot { background: var(--good); border-color: var(--good); }
.tl-step.is-current .tl-step__dot { background: var(--brand); border-color: var(--brand); }
.tl-step__rail { width: 2px; height: 22px; background: var(--border-strong); margin-left: 10px; }
.tl-step.is-done + .tl-step__rail, .tl-rail.is-done { background: var(--good); }
.tl-step__label { font-weight: 600; }
.tl-step__time { font-size: .8rem; color: var(--text-secondary); }

/* ---------- bar station ---------- */

.board {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  align-items: start;
}
.column { background: var(--surface-2); border-radius: var(--radius-lg); padding: 12px; }
.column__head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 4px;
}
.column__title { font-size: .8rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
.column__count {
  background: var(--surface-3); border-radius: 999px; padding: 1px 9px;
  font-size: .78rem; font-weight: 700;
}
.column__list { display: grid; gap: 10px; }

.ticket {
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 4px solid var(--brand);
  border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow-1);
}
.ticket--new { border-left-color: var(--series-1); }
.ticket--preparing { border-left-color: var(--warn); }
.ticket--ready { border-left-color: var(--good); }
.ticket--late { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: var(--shadow-1); }
  50% { box-shadow: 0 0 0 3px var(--danger-soft); }
}
.ticket__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ticket__umbrella {
  background: var(--brand); color: #fff; border-radius: 10px;
  padding: 2px 9px; font-weight: 750; font-size: .95rem;
}
.ticket__id { font-family: var(--mono); font-size: .76rem; color: var(--text-secondary); }
.ticket__timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .82rem; }
.ticket__timer.is-late { color: var(--danger); }
.ticket__lines { display: grid; gap: 6px; margin: 8px 0; }
.ticket__line { display: flex; gap: 8px; align-items: baseline; }
.ticket__line b { min-width: 22px; }
.ticket__note {
  background: var(--warn-soft); color: var(--warn); border-radius: 10px;
  padding: 6px 10px; font-size: .84rem; margin: 8px 0;
}
.ticket__foot { display: flex; gap: 8px; align-items: center; margin-top: 10px; }

.tabs { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--brand); }
.tab {
  appearance: none; border: 0; background: transparent; color: rgb(255 255 255 / 75%);
  font: inherit; font-weight: 650; font-size: .9rem; padding: 10px 14px;
  border-radius: 12px 12px 0 0; cursor: pointer; min-height: 44px;
}
.tab[aria-selected="true"] { background: var(--surface-0); color: var(--text-primary); }

/* ---------- umbrella grid ---------- */

.umb-grid {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
}
.umb {
  aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-1); display: grid; place-items: center;
  font-weight: 700; cursor: pointer; position: relative; font-size: .95rem;
  color: var(--text-primary);
}
.umb__sub { font-size: .62rem; font-weight: 600; color: var(--text-secondary); }
.umb.is-active { border-color: var(--brand); }
.umb[data-heat="0"] { background: var(--surface-1); }
.umb[data-heat="1"] { background: #cde2fb; }
.umb[data-heat="2"] { background: #9ec5f4; }
.umb[data-heat="3"] { background: #5598e7; color: #fff; }
.umb[data-heat="4"] { background: #256abf; color: #fff; }
.umb[data-heat="4"] .umb__sub, .umb[data-heat="3"] .umb__sub { color: rgb(255 255 255 / 85%); }

/* ---------- dashboard ---------- */

.kpis {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.kpi__label { font-size: .78rem; color: var(--text-secondary); font-weight: 600; }
.kpi__value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi__hint { font-size: .76rem; color: var(--text-secondary); }

.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; max-width: 100%; height: auto; }
.axis-label { font-size: 10px; fill: var(--text-secondary); }
.grid-line { stroke: var(--border); stroke-width: 1; }
.bar-track { fill: var(--surface-2); }

.hbar { display: grid; gap: 8px; }
.hbar__row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; }
.hbar__name { font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar__track { background: var(--surface-2); border-radius: 4px; height: 14px; position: relative; }
.hbar__fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--series-1); }
.hbar__value { font-size: .84rem; font-variant-numeric: tabular-nums; font-weight: 650; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.legend__item { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-secondary); }
.legend__swatch { width: 10px; height: 10px; border-radius: 3px; }

.stackbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.stackbar__seg { height: 100%; }

table.data { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.data th, table.data td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
table.data th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* ---------- sheet / modal ---------- */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgb(8 12 18 / 45%);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity .2s ease;
}
.sheet-backdrop.is-open { opacity: 1; }
.sheet {
  background: var(--surface-1);
  width: 100%; max-width: 560px;
  max-height: 92vh;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  display: flex; flex-direction: column;
  transform: translateY(14px); transition: transform .2s ease;
  box-shadow: var(--shadow-2);
}
.sheet--wide { max-width: 900px; }
.sheet-backdrop.is-open .sheet { transform: none; }
.sheet__head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.sheet__title { font-size: 1.05rem; flex: 1; }
.sheet__body { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet__foot {
  padding: 12px 16px calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  display: flex; gap: 10px;
}
.sheet__foot .btn { flex: 1; }
@media (min-width: 720px) {
  .sheet-backdrop { align-items: center; }
  .sheet { border-radius: var(--radius-lg); max-height: 86vh; }
}

/* ---------- flow hosts (in-app file viewers) ----------
   The host grew the frame to the whole document and scrolls it from outside,
   so nothing here may rely on its own scrollbar or on a fixed viewport. */

body.is-flowhost .topbar,
body.is-flowhost .chips { position: static; }

body.is-flowhost .cartbar {
  position: static;
  transform: none;
  backdrop-filter: none;
  margin-top: 20px;
}

body.is-flowhost .main--guest { padding-bottom: 16px; }

.sheet-backdrop--inline {
  position: static;
  background: none;
  display: block;
  opacity: 1;
}
.sheet-backdrop--inline .sheet {
  max-width: none;
  max-height: none;
  border-radius: 0;
  transform: none;
  box-shadow: none;
}
.sheet-backdrop--inline .sheet__body { overflow: visible; }
.sheet-backdrop--inline .sheet__head { position: static; }

/* ---------- toast ---------- */

.toast-host {
  position: fixed; left: 50%; bottom: calc(88px + var(--safe-bottom)); transform: translateX(-50%);
  z-index: 80; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px));
}
.toast {
  background: #10151c; color: #fff; padding: 12px 16px; border-radius: 12px;
  box-shadow: var(--shadow-2); font-size: .9rem; text-align: center;
  animation: toast-in .2s ease;
}
.toast--good { background: var(--good); }
.toast--danger { background: var(--danger); }
.toast.is-out { opacity: 0; transition: opacity .5s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- launcher (index) ---------- */

.launcher { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
.hero { text-align: center; padding: 30px 0 24px; }
.hero__title { font-size: clamp(1.6rem, 5vw, 2.4rem); }
.hero__sub { color: var(--text-secondary); max-width: 52ch; margin: 8px auto 0; }
.role-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.role {
  display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; box-shadow: var(--shadow-1);
}
.role:hover { border-color: var(--brand); }
.role img { width: 52px; height: 52px; border-radius: 14px; flex: none; }
.role__name { font-weight: 700; }
.role__desc { font-size: .84rem; color: var(--text-secondary); }

/* ---------- QR sheet ---------- */

.qr-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.qr-card {
  background: #fff; color: #101010; border: 1px solid #d8dee7; border-radius: 14px;
  padding: 12px; text-align: center; break-inside: avoid;
}
.qr-card svg { width: 100%; height: auto; }
.qr-card__no { font-size: 1.5rem; font-weight: 800; letter-spacing: .02em; }
.qr-card__label { font-size: .72rem; color: #4a5666; }
.qr-card__bar { font-size: .8rem; font-weight: 700; margin-bottom: 4px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .main { max-width: none; padding: 0; }
  .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .qr-card { border-color: #999; }
}

/* ---------- misc ---------- */

.notice {
  background: var(--brand-soft); color: var(--brand-strong);
  border-radius: 12px; padding: 10px 14px; font-size: .85rem;
}
.notice--warn { background: var(--warn-soft); color: var(--warn); }

.link-btn {
  appearance: none; background: none; border: 0; color: var(--brand);
  font: inherit; font-weight: 600; cursor: pointer; padding: 4px; text-decoration: underline;
}

.card-visual {
  background: linear-gradient(135deg, #1c5cab, #2a78d6 60%, #3987e5);
  color: #fff; border-radius: 16px; padding: 16px; min-height: 96px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow-1);
}
.card-visual__num { font-family: var(--mono); font-size: 1.1rem; letter-spacing: .08em; }
.card-visual__row { display: flex; justify-content: space-between; font-size: .8rem; opacity: .9; }

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgb(255 255 255 / 35%); border-top-color: #fff;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

<script>
/*
 * store.js — shared state, persistence and live sync.
 *
 * The prototype has no backend. Everything lives in localStorage and is
 * broadcast to the other open tabs/windows of the same browser through
 * BroadcastChannel (plus the `storage` event as a fallback). Guest app, bar
 * station and dashboard therefore update each other in real time on one device
 * — enough to demo the whole workflow. Swapping `Store.save` for an API call
 * is the only change needed for a real deployment.
 */
(function (global) {
  'use strict';

  var STATE_KEY = 'bb.state.v1';
  var DEVICE_KEY = 'bb.device.v1';
  var CHANNEL = 'beachbar';

  var DEFAULT_STATE = {
    version: 1,
    settings: {
      barName: 'Blue Wave Beach Bar',
      umbrellaCount: 40,
      vat: 0.24,
      currency: '€',
      avgPrepMinutes: 8
    },
    seq: 0,
    orders: [],
    music: [],
    invoices: []
  };

  var DEFAULT_DEVICE = {
    lang: null,           // set on first run from the browser language
    umbrella: null,
    guestName: '',
    email: '',
    card: null,           // { holder, last4, brand, expiry }
    theme: null,
    sound: true,
    seenIntro: false
  };

  var listeners = [];
  var channel = null;
  var state = null;
  var device = null;

  /* localStorage is unavailable in sandboxed previews, private-mode quirks and
     some in-app file viewers — there we keep everything in memory instead, so
     the app runs (just without remembering anything between reloads). */
  var storage = (function () {
    try {
      var probe = 'bb.probe';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
      return localStorage;
    } catch (err) {
      var memory = {};
      return {
        getItem: function (key) { return key in memory ? memory[key] : null; },
        setItem: function (key, value) { memory[key] = String(value); },
        removeItem: function (key) { delete memory[key]; }
      };
    }
  })();

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function readJSON(key, fallback) {
    try {
      var raw = storage.getItem(key);
      if (!raw) return clone(fallback);
      var parsed = JSON.parse(raw);
      return Object.assign(clone(fallback), parsed);
    } catch (err) {
      console.warn('store: could not read', key, err);
      return clone(fallback);
    }
  }

  function writeJSON(key, value) {
    try {
      storage.setItem(key, JSON.stringify(value));
    } catch (err) {
      console.warn('store: could not write', key, err);
    }
  }

  function emit(reason) {
    listeners.forEach(function (fn) {
      try { fn(state, reason); } catch (err) { console.error(err); }
    });
  }

  function broadcast(reason) {
    if (channel) {
      try { channel.postMessage({ type: 'state', reason: reason }); } catch (err) { /* ignore */ }
    }
  }

  function init() {
    state = readJSON(STATE_KEY, DEFAULT_STATE);
    device = readJSON(DEVICE_KEY, DEFAULT_DEVICE);
    if (!device.lang) {
      device.lang = (navigator.language || 'en').toLowerCase().indexOf('el') === 0 ? 'el' : 'en';
      writeJSON(DEVICE_KEY, device);
    }
    try {
      channel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(CHANNEL) : null;
    } catch (err) {
      channel = null;   // blocked in opaque origins; single-window still works
    }
    if (channel) {
      channel.onmessage = function (event) {
        if (event.data && event.data.type === 'state') {
          state = readJSON(STATE_KEY, DEFAULT_STATE);
          emit(event.data.reason || 'remote');
        }
      };
    }
    global.addEventListener('storage', function (event) {
      if (event.key === STATE_KEY) {
        state = readJSON(STATE_KEY, DEFAULT_STATE);
        emit('remote');
      }
    });
  }

  function commit(reason) {
    writeJSON(STATE_KEY, state);
    emit(reason);
    broadcast(reason);
  }

  function saveDevice(patch, reason) {
    Object.assign(device, patch || {});
    writeJSON(DEVICE_KEY, device);
    emit(reason || 'device');
  }

  // --- money ---------------------------------------------------------------

  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  function money(amount, lang) {
    var value = round2(amount || 0);
    return new Intl.NumberFormat(lang === 'el' ? 'el-GR' : 'en-IE',
      { style: 'currency', currency: 'EUR' }).format(value);
  }

  /* Unit price = base price + all selected option surcharges. */
  function unitPrice(itemId, options) {
    var item = DATA.MENU_BY_ID[itemId];
    if (!item) return 0;
    var price = item.price;
    Object.keys(options || {}).forEach(function (groupId) {
      var group = DATA.OPTION_GROUPS[groupId];
      if (!group) return;
      [].concat(options[groupId] || []).forEach(function (choiceId) {
        var choice = group.choices.find(function (c) { return c.id === choiceId; });
        if (choice) price += choice.delta || 0;
      });
    });
    return round2(price);
  }

  function lineTotal(line) { return round2(unitPrice(line.itemId, line.options) * line.qty); }

  function cartTotal(lines) {
    return round2((lines || []).reduce(function (sum, line) {
      return sum + lineTotal(line);
    }, 0));
  }

  /* Two lines merge when product, options and note are identical. */
  function lineKey(line) {
    var opts = Object.keys(line.options || {}).sort().map(function (g) {
      return g + ':' + [].concat(line.options[g]).sort().join('+');
    }).join('|');
    return line.itemId + '#' + opts + '#' + (line.note || '').trim().toLowerCase();
  }

  // --- orders --------------------------------------------------------------

  function nextOrderId() {
    state.seq = (state.seq || 0) + 1;
    var n = String(state.seq).padStart(3, '0');
    return { id: 'BB-' + n, seq: state.seq };
  }

  function placeOrder(input) {
    var ids = nextOrderId();
    var lines = (input.lines || []).map(function (line) {
      return {
        itemId: line.itemId,
        qty: line.qty,
        options: line.options || {},
        note: (line.note || '').trim(),
        unitPrice: unitPrice(line.itemId, line.options)
      };
    });
    var order = {
      id: ids.id,
      seq: ids.seq,
      umbrella: Number(input.umbrella),
      lines: lines,
      note: (input.note || '').trim(),
      guestName: input.guestName || '',
      channel: input.channel || 'qr',       // qr | manual
      staff: input.staff || '',
      total: cartTotal(lines),
      status: 'new',
      payment: {
        mode: input.payment && input.payment.mode ? input.payment.mode : 'tab',
        status: input.payment && input.payment.status ? input.payment.status : 'open',
        card: (input.payment && input.payment.card) || null,
        paidAt: (input.payment && input.payment.paidAt) || null
      },
      createdAt: Date.now(),
      acceptedAt: null,
      readyAt: null,
      servedAt: null
    };
    state.orders.unshift(order);
    commit('order:new');
    return order;
  }

  var FLOW = { new: 'preparing', preparing: 'ready', ready: 'served' };

  function advanceOrder(orderId) {
    var order = getOrder(orderId);
    if (!order || order.status === 'served' || order.status === 'cancelled') return null;
    return setStatus(orderId, FLOW[order.status]);
  }

  function setStatus(orderId, status) {
    var order = getOrder(orderId);
    if (!order) return null;
    order.status = status;
    var now = Date.now();
    if (status === 'preparing' && !order.acceptedAt) order.acceptedAt = now;
    if (status === 'ready' && !order.readyAt) order.readyAt = now;
    if (status === 'served') {
      order.servedAt = now;
      if (!order.readyAt) order.readyAt = now;
      if (!order.acceptedAt) order.acceptedAt = now;
    }
    commit('order:status');
    return order;
  }

  function cancelOrder(orderId) { return setStatus(orderId, 'cancelled'); }

  function getOrder(orderId) {
    return state.orders.find(function (o) { return o.id === orderId; }) || null;
  }

  function ordersForUmbrella(umbrella) {
    return state.orders.filter(function (o) { return o.umbrella === Number(umbrella); });
  }

  function openOrders() {
    return state.orders.filter(function (o) {
      return o.status !== 'served' && o.status !== 'cancelled';
    });
  }

  /* Everything the guest still owes: unpaid, non-cancelled orders. */
  function tabFor(umbrella) {
    var orders = ordersForUmbrella(umbrella).filter(function (o) {
      return o.status !== 'cancelled' && o.payment.status !== 'paid';
    });
    return { orders: orders, total: round2(orders.reduce(function (s, o) { return s + o.total; }, 0)) };
  }

  function markPaid(orderIds, paymentInfo) {
    orderIds.forEach(function (id) {
      var order = getOrder(id);
      if (!order) return;
      order.payment = Object.assign({}, order.payment, paymentInfo, {
        status: 'paid', paidAt: Date.now()
      });
    });
    commit('payment');
  }

  // --- music requests ------------------------------------------------------

  function addMusicRequest(input) {
    var request = {
      id: 'M-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
      umbrella: Number(input.umbrella),
      text: (input.text || '').trim(),
      status: 'new',
      createdAt: Date.now()
    };
    if (!request.text) return null;
    state.music.unshift(request);
    commit('music');
    return request;
  }

  function setMusicStatus(id, status) {
    var request = state.music.find(function (m) { return m.id === id; });
    if (!request) return;
    request.status = status;
    commit('music');
  }

  // --- fake invoices -------------------------------------------------------

  function sendInvoice(input) {
    var invoice = {
      id: 'INV-' + String(state.invoices.length + 1).padStart(4, '0'),
      email: input.email,
      umbrella: Number(input.umbrella),
      orderIds: input.orderIds || [],
      total: round2(input.total || 0),
      createdAt: Date.now()
    };
    state.invoices.unshift(invoice);
    commit('invoice');
    return invoice;
  }

  // --- demo data -----------------------------------------------------------

  /* relative order volume per hour of day — a typical beach day */
  var HOUR_WEIGHT = {
    9: 0.3, 10: 0.7, 11: 1.0, 12: 1.4, 13: 1.6, 14: 1.3,
    15: 1.1, 16: 1.2, 17: 0.9, 18: 0.5, 19: 0.4, 20: 0.3
  };
  var DEMO_HOURS_BACK = 8;

  function seedDemo(force) {
    if (state.orders.length && !force) return;
    state.orders = [];
    state.music = [];
    state.invoices = [];
    state.seq = 0;

    var rnd = mulberry32(20240814);
    var now = new Date();
    var count = state.settings.umbrellaCount;

    // history for the hours behind us, so the day looks alive whenever the
    // prototype is opened — never before midnight, never in the future
    var dayStart = new Date(now); dayStart.setHours(0, 0, 0, 0);

    for (var back = DEMO_HOURS_BACK; back >= 1; back--) {
      var slotStart = now.getTime() - back * 3600000;
      if (slotStart < dayStart.getTime()) continue;
      var hourOfDay = new Date(slotStart).getHours();
      var weight = HOUR_WEIGHT[hourOfDay] != null ? HOUR_WEIGHT[hourOfDay] : 0.6;
      var n = Math.round(weight * 4 + rnd() * 2);
      for (var i = 0; i < n; i++) {
        var when = new Date(slotStart + Math.floor(rnd() * 3600000));
        if (when.getTime() > now.getTime() - 900000) continue;
        var lines = randomLines(rnd);
        var ids = nextOrderId();
        var paidByCard = rnd() < 0.55;
        var order = {
          id: ids.id,
          seq: ids.seq,
          umbrella: 1 + Math.floor(rnd() * count),
          lines: lines,
          note: '',
          guestName: '',
          channel: rnd() < 0.8 ? 'qr' : 'manual',
          staff: '',
          total: cartTotal(lines),
          status: 'served',
          payment: {
            mode: paidByCard ? 'card' : (rnd() < 0.5 ? 'cash' : 'tab'),
            status: paidByCard || rnd() < 0.7 ? 'paid' : 'open',
            card: paidByCard ? '•••• 4242' : null,
            paidAt: when.getTime() + 600000
          },
          createdAt: when.getTime(),
          acceptedAt: when.getTime() + 60000 + Math.floor(rnd() * 120000),
          readyAt: when.getTime() + 240000 + Math.floor(rnd() * 300000),
          servedAt: when.getTime() + 420000 + Math.floor(rnd() * 300000)
        };
        state.orders.push(order);
      }
    }

    state.orders.sort(function (a, b) { return b.createdAt - a.createdAt; });

    ['new', 'new', 'preparing', 'ready'].forEach(function (status, index) {
      var lines = randomLines(rnd);
      var ids = nextOrderId();
      var ago = (index + 1) * 90000 + Math.floor(rnd() * 60000);
      state.orders.unshift({
        id: ids.id, seq: ids.seq,
        umbrella: 1 + Math.floor(rnd() * count),
        lines: lines, note: index === 0 ? 'Please bring extra napkins' : '',
        guestName: '', channel: 'qr', staff: '',
        total: cartTotal(lines), status: status,
        payment: { mode: 'card', status: 'paid', card: '•••• 4242', paidAt: Date.now() - ago },
        createdAt: Date.now() - ago,
        acceptedAt: status === 'new' ? null : Date.now() - ago + 40000,
        readyAt: status === 'ready' ? Date.now() - 30000 : null,
        servedAt: null
      });
    });

    ['Bob Marley – Three Little Birds', 'Despacito', 'Πέτρος Ιακωβίδης – Θάλασσα']
      .forEach(function (text, i) {
        state.music.push({
          id: 'M-DEMO' + i, umbrella: 3 + i * 7, text: text,
          status: i === 2 ? 'played' : 'new',
          createdAt: Date.now() - (i + 1) * 900000

        if (group.type === 'multi') return;
        options[groupId] = [group.choices[Math.floor(rnd() * group.choices.length)].id];

        qty: 1 + Math.floor(rnd() * 2),

/*
 * qrcode.js — minimal QR code generator (ISO/IEC 18004), byte mode, EC level M.
 *
 * Self-contained, no dependencies, no network: the umbrella QR codes have to be
 * printable on a beach with a flaky connection. Supports versions 1–10, which
 * covers every URL this app produces (up to 213 bytes).
 *
 * QR.matrix(text) -> array of rows of booleans (true = dark module)
 * QR.svg(text, opts) -> SVG string
 */

  'use strict';

  // --- GF(256) arithmetic, primitive polynomial 0x11d ----------------------
  var EXP = new Uint8Array(512);

    var x = 1;

      LOG[x] = i;
      x <<= 1;

  function newMatrix(size) {
    var m = [];
    for (var i = 0; i < size; i++) m.push(new Array(size).fill(null));
    return m;
  }

  function placeFinder(m, row, col) {
    for (var r = -1; r <= 7; r++) {
      for (var c = -1; c <= 7; c++) {
        var rr = row + r, cc = col + c;
        if (rr < 0 || rr >= m.length || cc < 0 || cc >= m.length) continue;
        var dark = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                   (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                   (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        m[rr][cc] = dark;
      }
    }
  }

  function placeAlignment(m, version) {
    var centers = ALIGN[version];
    var last = m.length - 1;
    centers.forEach(function (r) {
      centers.forEach(function (c) {
        var corner = (r === 6 && c === 6) || (r === 6 && c === last - 6) ||
                     (r === last - 6 && c === 6);
        if (corner) return;
        for (var dr = -2; dr <= 2; dr++) {
          for (var dc = -2; dc <= 2; dc++) {
            m[r + dr][c + dc] =
              Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
          }
        }
      });
    });
  }

  function placeTiming(m) {
    for (var i = 8; i < m.length - 8; i++) {
      if (m[6][i] === null) m[6][i] = i % 2 === 0;
      if (m[i][6] === null) m[i][6] = i % 2 === 0;
    }
  }

  function reserveFormat(m) {
    var size = m.length;
    for (var i = 0; i < 9; i++) {
      if (m[8][i] === null) m[8][i] = false;
      if (m[i][8] === null) m[i][8] = false;
    }
    for (var j = 0; j < 8; j++) {
      if (m[8][size - 1 - j] === null) m[8][size - 1 - j] = false;
      if (m[size - 1 - j][8] === null) m[size - 1 - j][8] = false;
    }
    m[size - 8][8] = true; // dark module
  }

  function placeVersionInfo(m, version) {
    if (version < 7) return;
    var rem = version;
    for (var i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    var bits = (version << 12) | rem;
    var size = m.length;
    for (var k = 0; k < 18; k++) {
      var bit = ((bits >> k) & 1) === 1;
      var a = Math.floor(k / 3), b = (k % 3) + size - 11;
      m[a][b] = bit;
      m[b][a] = bit;
    }
  }

  function placeData(m, codewords, reserved) {
    var size = m.length, bitIndex = 0, upward = true;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right--; // skip vertical timing column
      for (var v = 0; v < size; v++) {
        var row = upward ? size - 1 - v : v;
        for (var c = 0; c < 2; c++) {
          var col = right - c;
          if (reserved[row][col]) continue;
          var bit = false;
          if (bitIndex < codewords.length * 8) {
            bit = ((codewords[bitIndex >> 3] >> (7 - (bitIndex & 7))) & 1) === 1;
          }
          m[row][col] = bit;
          bitIndex++;
        }
      }
      upward = !upward;
    }
  }

  var MASKS = [
    function (r, c) { return (r + c) % 2 === 0; },
    function (r) { return r % 2 === 0; },
    function (r, c) { return c % 3 === 0; },
    function (r, c) { return (r + c) % 3 === 0; },
    function (r, c) { return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; },
    function (r, c) { return ((r * c) % 2) + ((r * c) % 3) === 0; },
    function (r, c) { return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0; },
    function (r, c) { return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0; }
  ];

  function applyFormat(m, maskIndex) {
    // EC level M = 0b00, BCH(15,5) with generator 0x537, XOR mask 0x5412
    var data = (0b00 << 3) | maskIndex;
    var rem = data;
    for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    var bits = ((data << 10) | rem) ^ 0x5412;
    var size = m.length;
    for (var k = 0; k < 15; k++) {
      var bit = ((bits >> k) & 1) === 1;
      // copy 1 — around the top-left finder
      if (k < 6) m[k][8] = bit;
      else if (k < 8) m[k + 1][8] = bit;
      else if (k === 8) m[8][7] = bit;
      else m[8][14 - k] = bit;
      // copy 2 — split between bottom-left and top-right
      if (k < 8) m[8][size - 1 - k] = bit;
      else m[size - 15 + k][8] = bit;
    }
  }

  function penalty(m) {
    var size = m.length, score = 0, r, c, i;
    // rule 1: runs of 5+ same-colour modules
    for (r = 0; r < size; r++) {
      for (var dir = 0; dir < 2; dir++) {
        var run = 1;
        for (c = 1; c < size; c++) {
          var cur = dir ? m[c][r] : m[r][c];
          var prev = dir ? m[c - 1][r] : m[r][c - 1];
          if (cur === prev) {
            run++;
            if (run === 5) score += 3;
            else if (run > 5) score += 1;
          } else run = 1;
        }
      }
    }
    // rule 2: 2x2 blocks of the same colour
    for (r = 0; r < size - 1; r++) {
      for (c = 0; c < size - 1; c++) {
        var v = m[r][c];
        if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
      }
    }
    // rule 3: finder-like 1:1:3:1:1 patterns
    var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
    var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
    function matches(line, at, pat) {
      for (var k = 0; k < 11; k++) if (line[at + k] !== pat[k]) return false;
      return true;
    }
    for (r = 0; r < size; r++) {
      var row = m[r], col = [];
      for (i = 0; i < size; i++) col.push(m[i][r]);
      for (c = 0; c + 11 <= size; c++) {
        if (matches(row, c, pat1) || matches(row, c, pat2)) score += 40;
        if (matches(col, c, pat1) || matches(col, c, pat2)) score += 40;
      }
    }
    // rule 4: overall dark/light balance
    var dark = 0;
    for (r = 0; r < size; r++) for (c = 0; c < size; c++) if (m[r][c]) dark++;
    var pct = (dark * 100) / (size * size);
    score += Math.floor(Math.abs(pct - 50) / 5) * 10;
    return score;
  }

  function matrix(text) {
    var bytes = utf8Bytes(String(text));
    var version = pickVersion(bytes.length);
    var codewords = buildCodewords(bytes, version);
    var size = version * 4 + 17;

    var base = newMatrix(size);
    placeFinder(base, 0, 0);
    placeFinder(base, 0, size - 7);
    placeFinder(base, size - 7, 0);
    placeAlignment(base, version);
    placeTiming(base);
    placeVersionInfo(base, version);
    reserveFormat(base);

    var reserved = base.map(function (row) {
      return row.map(function (cell) { return cell !== null; });
    });

    var best = null, bestScore = Infinity;
    for (var maskIndex = 0; maskIndex < 8; maskIndex++) {
      var m = base.map(function (row) { return row.slice(); });
      placeData(m, codewords, reserved);
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (!reserved[r][c] && MASKS[maskIndex](r, c)) m[r][c] = !m[r][c];
        }
      }
      applyFormat(m, maskIndex);
      var score = penalty(m);
      if (score < bestScore) { bestScore = score; best = m; }
    }
    return best;
  }

  function svg(text, opts) {
    opts = opts || {};
    var quiet = opts.quiet == null ? 4 : opts.quiet;
    var dark = opts.dark || '#101010';
    var light = opts.light || '#ffffff';
    var m = matrix(text);
    var size = m.length + quiet * 2;
    var path = '';
    for (var r = 0; r < m.length; r++) {
      for (var c = 0; c < m.length; c++) {
        if (m[r][c]) path += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' +
      size + '" shape-rendering="crispEdges" role="img" aria-label="QR code">' +
      '<rect width="' + size + '" height="' + size + '" fill="' + light + '"/>' +
      '<path d="' + path + '" fill="' + dark + '"/></svg>';
  }

  global.QR = { matrix: matrix, svg: svg };
})(typeof window !== 'undefined' ? window : globalThis);
