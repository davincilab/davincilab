<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Bar — Order</title>
<meta name="description" content="Order from your sunbed — scan, choose, enjoy.">
<link rel="manifest" href="manifest-guest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beach Bar">
<link rel="apple-touch-icon" href="assets/icons/icon-guest-180.png">
<link rel="icon" href="assets/icons/icon-guest-32.png" sizes="32x32">
<link rel="icon" href="assets/icons/icon-guest-192.png" sizes="192x192">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-app="guest">
<div class="app">
  <header class="topbar">
    <div class="badge-umbrella" id="umbrellaBadge">⛱️ <b>–</b></div>
    <div style="flex:1;min-width:0">
      <div class="topbar__title" id="barName">Beach Bar</div>
      <div class="topbar__sub" id="topSub"></div>
    </div>
    <div id="langHost"></div>
    <button class="icon-btn" id="btnOrders" aria-label="Your orders">🧾</button>
    <button class="icon-btn" id="btnAccount" aria-label="Account">👤</button>
  </header>

  <nav class="chips" id="chips" aria-label="Categories"></nav>

  <main class="main main--guest" id="view"></main>

  <div class="cartbar" id="cartbar">
    <div class="cartbar__inner">
      <button class="btn btn--primary btn--block" id="cartBtn">
        <span id="cartCount"></span><span class="spacer"></span><span id="cartSum"></span>
      </button>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/guest.js"></script>
</body>
</html>
